# App iPhone sur un Mac de GitHub :
# - « simulateur » : compile l'app, la lance dans le simulateur d'iPhone en français puis en anglais,
#   et publie les captures dans la Release « App iPhone (simulateur) » ;
# - « testflight » : signe l'app avec le compte Apple Developer et l'envoie sur TestFlight.
#   Il faut les secrets APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 et APPLE_TEAM_ID ;
#   sans eux, cette partie est simplement sautée.
name: App iPhone

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulateur:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Préparer le jeu et le copier dans le projet iPhone
        run: npm run build && npx cap sync ios
      - name: Compiler pour le simulateur d'iPhone
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/dd/Build/Products/Debug-iphonesimulator/App.app
      - name: Vérifier les messages d'autorisation en français et en anglais
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/App.app
          for l in en fr; do plutil -p "$APP/$l.lproj/InfoPlist.strings"; done
      - name: Lancer le jeu dans le simulateur (français puis anglais)
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/App.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p captures-ios
          for loc in fr_FR en_US; do
            l=${loc%_*}
            xcrun simctl terminate "$UDID" com.barzoute.glacelicorne || true
            xcrun simctl launch "$UDID" com.barzoute.glacelicorne -AppleLanguages "($l)" -AppleLocale "$loc"
            sleep 20
            xcrun simctl io "$UDID" screenshot "captures-ios/iphone-$l.png"
          done
          ls -la captures-ios
      - uses: actions/upload-artifact@v4
        with:
          name: captures-iphone-simulateur
          path: captures-ios
      - name: Publier les captures dans la Release « App iPhone (simulateur) »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-simulateur
          target_commitish: ${{ github.sha }}
          name: App iPhone (simulateur)
          prerelease: true
          body: |
            Le jeu lancé dans le simulateur d'iPhone sur un Mac de GitHub (commit ${{ github.sha }}) : en français (iphone-fr.png) et en anglais (iphone-en.png).
            Ce n'est pas encore une app installable : il faudra le compte Apple Developer pour la signer et l'envoyer sur TestFlight.
          files: captures-ios/*.png

  testflight:
    runs-on: macos-latest
    steps:
      - name: Vérifier que les clés Apple sont là
        id: cles
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] && [ -n "$TEAM" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "Secrets Apple absents : envoi TestFlight sauté."; fi
      - uses: actions/checkout@v4
        if: steps.cles.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.cles.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm
      - name: Préparer le jeu et le copier dans le projet iPhone
        if: steps.cles.outputs.ok == '1'
        run: npm ci && npm run build && npx cap sync ios
      - name: Archiver, signer et envoyer sur TestFlight
        if: steps.cles.outputs.ok == '1'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYDIR="$HOME/.appstoreconnect/private_keys"; mkdir -p "$KEYDIR"
          KEY="$KEYDIR/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          # Numéro de build : il doit augmenter à chaque envoi.
          BUILD=$((100 + ${{ github.run_number }}))
          # Archive sans signature ; la signature de distribution se fait à l'export, par Apple (« cloud signing »).
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGNING_ALLOWED=NO archive | tail -n 30
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}"
          rm -f "$KEY"
          echo "Build $BUILD envoyé à App Store Connect (TestFlight)."
