# Compile l'app Android (APK de test) à chaque envoi sur la branche « app ».
# L'APK se télécharge depuis l'onglet Actions de GitHub, dans les « Artifacts » de l'exécution.
name: App Android

on:
  push:
    branches: [app]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installer les dépendances
        run: npm ci
      - name: Préparer le jeu et le copier dans le projet Android
        run: npm run build && npx cap sync android
      - name: Compiler l'APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: glace-licorne-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
