<title>Glace Licorne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Plein écran : un seul canvas pixel art, deux boutons flottants. */
  :root {
    --night: #1f1533;
    --ink: #3b2550;
    --cream: #fff4e6;
    --pink: #ff9ecf;
    --pixel: "Press Start 2P", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--night);
    color: var(--cream);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
  #game { display: block; }
  .btns {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .btns button {
    width: 44px;
    height: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    background: var(--ink);
    border: 3px solid var(--cream);
    color: var(--cream);
    cursor: pointer;
    clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
  }
  .btns button[hidden] { display: none; }
  .btns button:active { background: var(--pink); color: var(--ink); }
  .btns button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .btns svg { width: 24px; height: 24px; shape-rendering: crispEdges; }
  #safe {
    position: fixed;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" role="img" aria-label="Jeu Glace Licorne : touche l'écran pour sauter de plateforme en plateforme"></canvas></div>
<div class="btns">
  <button id="btnHome" type="button" aria-label="Changer de personnage" hidden>
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="5" y="1" width="2" height="1" fill="currentColor"/><rect x="4" y="2" width="4" height="1" fill="currentColor"/><rect x="3" y="3" width="6" height="1" fill="currentColor"/><rect x="2" y="4" width="8" height="1" fill="currentColor"/><rect x="1" y="5" width="10" height="1" fill="currentColor"/><rect x="2" y="6" width="8" height="5" fill="currentColor"/><rect x="5" y="8" width="2" height="3" fill="#3b2550"/></svg>
  </button>
  <button id="btnPause" type="button" aria-label="Pause" hidden>
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="3" y="2" width="2" height="8" fill="currentColor"/><rect x="7" y="2" width="2" height="8" fill="currentColor"/></svg>
  </button>
  <button id="btnSound" type="button" aria-label="Couper le son"></button>
</div>
<div id="safe" aria-hidden="true"></div>
<script>
(() => {
  'use strict';

  // ---------- Utilitaires ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function hash(n) {
    n |= 0;
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    return (n ^ (n >>> 16)) >>> 0;
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem('glace-licorne:' + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('glace-licorne:' + k, String(v)); } catch (e) { /* stockage indisponible */ } }
  };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

  // ---------- Son : synthé FM façon Mega Drive, une musique par monde ----------
  const Sound = (() => {
    let ac = null, master, music, sfx, sendFx, delayNode, noise;
    let muted = store.get('muted', '0') === '1';
    let timer = 0, step = 0, nextT = 0, on = false, pending = null;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    const n2m = s => { const m = s.match(/^([A-G])(#?)(\d)$/); return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0); };

    // Instruments FM : ratio et index du modulateur, enveloppe de volume.
    const LEAD = { ratio: 1, index: 2.2, idxSus: 0.6, idxDecay: 0.15, vol: 0.2, a: 0.006, d: 0.12, sus: 0.7, rel: 0.08 };
    const BASS = { ratio: 1, index: 3.5, idxSus: 0.3, idxDecay: 0.09, vol: 0.32, a: 0.004, d: 0.1, sus: 0.55, rel: 0.05 };
    const BELL = { ratio: 3.5, index: 2.5, idxSus: 0.1, idxDecay: 0.25, vol: 0.16, a: 0.003, d: 0.2, sus: 0.3, rel: 0.15 };
    const KOTO = { ratio: 3, index: 2.2, idxSus: 0.15, idxDecay: 0.1, vol: 0.22, a: 0.002, d: 0.3, sus: 0.12, rel: 0.25 };
    const SOFTBASS = { ratio: 1, index: 1.4, idxSus: 0.5, idxDecay: 0.12, vol: 0.3, a: 0.01, d: 0.15, sus: 0.6, rel: 0.08 };
    const BRASS = { ratio: 1, index: 3, idxSus: 0.8, idxDecay: 0.08, vol: 0.17, a: 0.02, d: 0.1, sus: 0.8, rel: 0.06 };
    const SLAP = { ratio: 1, index: 6, idxSus: 0.2, idxDecay: 0.06, vol: 0.34, a: 0.003, d: 0.12, sus: 0.4, rel: 0.04 };
    const ORGAN = { ratio: 2, index: 1.6, idxSus: 0.7, idxDecay: 0.1, vol: 0.18, a: 0.005, d: 0.1, sus: 0.75, rel: 0.08 };
    const ACCORDION = { ratio: 1, index: 2.6, idxSus: 0.85, idxDecay: 0.05, vol: 0.13, a: 0.015, d: 0.08, sus: 0.85, rel: 0.06 };
    const STAB = { ratio: 1, index: 2, idxSus: 0.6, idxDecay: 0.05, vol: 0.05, a: 0.005, d: 0.08, sus: 0.5, rel: 0.05 };

    // Une mesure = 8 croches (6 pour une valse). "-" prolonge la note, "." est un silence.
    function song(o) {
      o.spb = o.spb || 16;
      o.len = o.prog.length * o.spb;
      o.step = 60 / o.bpm / 4;
      o.seq = new Array(o.len).fill(null);
      let last = null;
      o.mel.forEach((bar, b) => bar.split(' ').forEach((t, i) => {
        const s = b * o.spb + i * 2;
        if (t === '-') { if (last) last.len += 2; }
        else if (t === '.') { last = null; }
        else { last = { m: n2m(t) - 12, len: 2 }; o.seq[s] = last; }
      }));
      return o;
    }
    const SONGS = [
      song({ // Monde des Glaces : pop sucrée en do majeur
        bpm: 132, lead: LEAD, bass: BASS, arpWave: 'square', arpVol: 0.045, arpEvery: 1,
        chords: {
          C: { b: 48, a: [60, 64, 67, 72] }, G: { b: 43, a: [55, 59, 62, 67] },
          Am: { b: 45, a: [57, 60, 64, 69] }, F: { b: 41, a: [53, 57, 60, 65] }
        },
        prog: ['C', 'G', 'Am', 'F', 'C', 'G', 'F', 'G', 'Am', 'F', 'C', 'G', 'Am', 'F', 'G', 'G'],
        mel: [
          'E5 G5 C6 G5 E5 G5 C6 D6', 'B5 - G5 - D5 G5 B5 D6', 'C6 - A5 - E5 A5 C6 E6', 'D6 C6 A5 F5 A5 - . .',
          'G5 E5 G5 C6 E6 - D6 C6', 'D6 - B5 G5 B5 D6 G6 -', 'F6 E6 D6 C6 A5 C6 F6 -', 'G6 - F6 - D6 - B5 -',
          'A5 - C6 - E6 - D6 C6', 'C6 - A5 - F5 - A5 -', 'G5 - E5 G5 C6 - E6 -', 'D6 - - - B5 - G5 -',
          'A5 C6 E6 A6 G6 E6 C6 A5', 'F5 A5 C6 F6 E6 C6 A5 F5', 'G5 B5 D6 G6 F6 D6 B5 G5', 'D6 - E6 - F6 - G6 -'
        ],
        bassPat: [0, 12, 0, 12, 0, 12, 7, 12],
        drums: { kick: [0, 6, 8], kickAlt: [14], snare: [4, 12], hat: 2 }
      }),
      song({ // Voyage au Japon : gamme pentatonique, koto, taiko et bloc de bois
        bpm: 116, lead: KOTO, bass: SOFTBASS, arpWave: 'triangle', arpVol: 0.07, arpEvery: 2,
        chords: {
          Am: { b: 45, a: [57, 60, 64, 69] }, G: { b: 43, a: [55, 59, 62, 67] }, F: { b: 41, a: [53, 57, 60, 65] },
          Em: { b: 40, a: [52, 55, 59, 64] }, Dsus: { b: 50, a: [50, 55, 57, 62] }
        },
        prog: ['Am', 'G', 'F', 'G', 'Am', 'Dsus', 'Em', 'Am', 'F', 'G', 'Am', 'Em', 'F', 'G', 'Dsus', 'Am'],
        mel: [
          'A5 - C6 D6 E6 - D6 C6', 'D6 - E6 G6 E6 - D6 -', 'C6 - A5 C6 D6 C6 A5 G5', 'A5 - - - G5 - E5 -',
          'E6 G6 A6 G6 E6 D6 C6 D6', 'E6 - D6 - A5 - D6 -', 'G6 - E6 D6 E6 - G6 A6', 'A6 - - - . . E6 -',
          'C6 D6 E6 - C6 D6 E6 G6', 'A6 - G6 E6 D6 - E6 -', 'C6 - A5 - C6 D6 E6 -', 'G6 - E6 - D6 - - -',
          'A5 C6 D6 E6 G6 E6 D6 C6', 'D6 E6 G6 A6 G6 E6 D6 E6', 'A6 G6 E6 D6 E6 - D6 C6', 'A5 - - - - - . .'
        ],
        bassPat: [0, null, 7, null, 12, null, 7, null],
        drums: { taiko: [0, 8], taikoHi: [6, 14, 15], block: [4, 12], hat: 4 }
      }),
      song({ // La Grosse Pomme : groove jazzy-funky, basse slap et cuivres
        bpm: 138, lead: BRASS, bass: SLAP, arpWave: 'square', arpVol: 0.035, arpEvery: 1,
        chords: {
          Dm7: { b: 50, a: [62, 65, 69, 72] }, G7: { b: 43, a: [59, 62, 65, 67] }, Cmaj7: { b: 48, a: [60, 64, 67, 71] },
          A7: { b: 45, a: [61, 64, 67, 69] }, Fmaj7: { b: 41, a: [57, 60, 64, 65] }, E7: { b: 40, a: [56, 59, 62, 64] },
          Am7: { b: 45, a: [60, 64, 67, 69] }
        },
        prog: ['Dm7', 'G7', 'Cmaj7', 'A7', 'Dm7', 'G7', 'Cmaj7', 'Cmaj7', 'Fmaj7', 'E7', 'Am7', 'A7', 'Dm7', 'G7', 'Cmaj7', 'G7'],
        mel: [
          'D6 F6 A6 - G6 F6 D6 -', 'F6 - D6 B5 D6 - G5 -', 'E6 G6 B6 - A6 G6 E6 -', 'C#6 - E6 G6 A6 - G6 E6',
          'F6 - A6 F6 D6 - F6 -', 'G6 F6 D6 B5 G5 - B5 D6', 'C6 - E6 G6 C7 - B6 -', 'G6 - - - . . G6 A6',
          'A6 - C7 A6 G6 - F6 -', 'G#6 - B6 G#6 E6 - D6 -', 'C6 E6 A6 - G6 E6 C6 -', 'C#6 - E6 - G6 - A6 -',
          'D6 - F6 A6 C7 A6 F6 D6', 'B5 D6 F6 G6 F6 D6 B5 G5', 'E6 - G6 - C7 - B6 G6', 'F6 - D6 - B5 - G5 -'
        ],
        bassPat: [0, 12, 0, 12, 7, 12, 10, 12],
        drums: { kick: [0, 7, 10], snare: [4, 12], hat: 1, open: [14] }
      }),
      song({ // Escale à Londres : pop anglaise des années 60, orgue, guitare en arpèges, basse qui roule
        bpm: 128, lead: ORGAN, bass: BASS, arpWave: 'square', arpVol: 0.04, arpEvery: 2,
        chords: {
          G: { b: 43, a: [55, 59, 62, 67] }, D: { b: 50, a: [54, 57, 62, 66] }, Em: { b: 40, a: [52, 55, 59, 64] },
          C: { b: 48, a: [55, 60, 64, 67] }, Am: { b: 45, a: [57, 60, 64, 69] }
        },
        prog: ['G', 'D', 'Em', 'C', 'G', 'D', 'C', 'D', 'Em', 'C', 'G', 'D', 'Am', 'C', 'D', 'D'],
        mel: [
          'D6 - B5 D6 G6 - F#6 E6', 'F#6 - D6 - A5 - D6 -', 'E6 G6 B6 - A6 G6 E6 -', 'G6 - E6 C6 D6 - E6 -',
          'B5 D6 G6 - B6 - A6 G6', 'A6 - F#6 D6 F#6 - A6 -', 'G6 E6 C6 E6 G6 - C7 -', 'B6 - A6 - F#6 - D6 -',
          'E6 - B5 E6 G6 - E6 -', 'C6 E6 G6 - E6 - C6 -', 'D6 G6 B6 - A6 G6 D6 -', 'F#6 - A6 - D7 - A6 -',
          'C7 - A6 E6 A6 - C7 -', 'E7 - C7 G6 E6 - G6 -', 'F#6 E6 D6 E6 F#6 - A6 -', 'D7 - - - . . D6 -'
        ],
        bassPat: [0, 12, 7, 12, 0, 12, 7, 5],
        drums: { kick: [0, 8], snare: [4, 12], hat: 2, open: [6, 14] }
      }),
      song({ // Bonjour Paris : valse musette à l'accordéon, « boum-tchac-tchac »
        bpm: 180, spb: 12, lead: ACCORDION, detune: 0.006, bass: SOFTBASS, stab: STAB, stabs: [4, 8], altFifth: true,
        chords: {
          G: { b: 43, a: [55, 59, 62, 67] }, D7: { b: 50, a: [54, 57, 60, 62] }, C: { b: 48, a: [55, 60, 64, 67] },
          Em: { b: 40, a: [52, 55, 59, 64] }, Am: { b: 45, a: [57, 60, 64, 69] }
        },
        prog: ['G', 'G', 'D7', 'D7', 'D7', 'D7', 'G', 'G', 'C', 'C', 'G', 'Em', 'Am', 'D7', 'G', 'G'],
        mel: [
          'D6 - B5 - G5 -', 'D6 E6 D6 C6 B5 -', 'C6 - A5 - F#5 -', 'A5 B5 A5 G5 F#5 -',
          'D6 - C6 - A5 -', 'F#6 E6 D6 C6 A5 -', 'B5 - G5 - D5 -', 'G5 A5 B5 C6 D6 -',
          'E6 - G6 - E6 -', 'C6 D6 E6 F6 G6 -', 'D6 - B5 - G5 -', 'B5 C6 B5 A5 G5 -',
          'A5 - C6 - E6 -', 'D6 C6 A5 F#5 D5 -', 'G5 - B5 - D6 -', 'G6 - - - . .'
        ],
        bassPat: [0, null, null, null, null, null],
        drums: { kick: [0], hat: 4 }
      })
    ];
    let cur = SONGS[0];

    function init() {
      if (ac) { if (ac.state !== 'running') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { ac = null; return; }
      const comp = ac.createDynamicsCompressor();
      comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(comp);
      music = ac.createGain(); music.gain.value = 0.5; music.connect(master);
      sfx = ac.createGain(); sfx.gain.value = 0.6; sfx.connect(master);
      delayNode = ac.createDelay(1); delayNode.delayTime.value = cur.step * 3;
      const fb = ac.createGain(); fb.gain.value = 0.3;
      const wet = ac.createGain(); wet.gain.value = 0.3;
      delayNode.connect(fb); fb.connect(delayNode); delayNode.connect(wet); wet.connect(music);
      sendFx = delayNode;
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // Débloque l'audio sur iOS avec un son vide.
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
      if (ac.state !== 'running') ac.resume();
    }

    function env(g, t, peak, a, d, sus, end, rel) {
      const p = g.gain, s = Math.max(0.0001, peak * sus);
      p.setValueAtTime(0.0001, t);
      p.linearRampToValueAtTime(peak, t + a);
      p.exponentialRampToValueAtTime(s, t + a + d);
      p.setValueAtTime(s, end);
      p.exponentialRampToValueAtTime(0.0001, end + rel);
    }
    function fm(dest, t, f, dur, o) {
      const car = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
      car.frequency.setValueAtTime(f, t);
      mod.frequency.setValueAtTime(f * o.ratio, t);
      mg.gain.setValueAtTime(f * o.index, t);
      mg.gain.exponentialRampToValueAtTime(Math.max(0.0001, f * o.index * o.idxSus), t + o.idxDecay);
      mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(dest);
      const end = Math.max(t + dur, t + o.a + o.d + 0.001);
      env(g, t, o.vol, o.a, o.d, o.sus, end, o.rel);
      if (o.glide) {
        car.frequency.exponentialRampToValueAtTime(f * o.glide, t + dur);
        mod.frequency.exponentialRampToValueAtTime(f * o.glide * o.ratio, t + dur);
      }
      const stop = end + o.rel + 0.05;
      car.start(t); mod.start(t); car.stop(stop); mod.stop(stop);
      return g;
    }
    function playArp(t, m) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = cur.arpWave; o.frequency.value = mtof(m);
      o.connect(g); g.connect(music);
      env(g, t, cur.arpVol, 0.002, 0.05, 0.4, t + cur.step * cur.arpEvery * 0.8, 0.03);
      o.start(t); o.stop(t + cur.step * cur.arpEvery + 0.1);
    }
    // Percussion accordée : grosse caisse, taiko, bloc de bois.
    function drum(t, f0, f1, dur, vol) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.6);
      o.connect(g); g.connect(music);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function nz(t, dur, vol, type, freq, q, dest) {
      const s = ac.createBufferSource(); s.buffer = noise;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
      const g = ac.createGain();
      s.connect(f); f.connect(g); g.connect(dest || music);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function snare(t) {
      nz(t, 0.16, 0.28, 'bandpass', 1800, 0.8);
      drum(t, 220, 140, 0.1, 0.18);
    }
    function sched(s, t) {
      const S = cur, bar = (s / S.spb) | 0, i = s % S.spb, ch = S.chords[S.prog[bar]], d = S.drums;
      if (d.kick && (d.kick.includes(i) || (d.kickAlt && bar % 2 === 1 && d.kickAlt.includes(i)))) drum(t, 160, 42, 0.2, 0.7);
      if (d.snare && d.snare.includes(i)) snare(t);
      if (d.hat && i % d.hat === 0) nz(t, 0.035, i % 4 === 2 ? 0.07 : 0.04, 'highpass', 7000);
      if (d.open && d.open.includes(i)) nz(t, 0.18, 0.06, 'highpass', 6000);
      if (d.taiko && d.taiko.includes(i)) drum(t, 110, 50, 0.45, 0.8);
      if (d.taikoHi && d.taikoHi.includes(i)) drum(t, 210, 130, 0.2, 0.35);
      if (d.block && d.block.includes(i)) drum(t, 1500, 1350, 0.05, 0.25);
      if (i % 2 === 0) {
        const off = S.bassPat[i / 2];
        if (off != null) fm(music, t, mtof(ch.b + off + (S.altFifth && bar % 2 ? 7 : 0)), S.step * 1.6, S.bass);
      }
      if (S.arpEvery && i % S.arpEvery === 0) playArp(t, ch.a[(i / S.arpEvery) % 4] + 12);
      if (S.stabs && S.stabs.includes(i)) ch.a.slice(1).forEach(m => fm(music, t, mtof(m), S.step * 2.5, S.stab));
      const ev = S.seq[s];
      if (ev) {
        fm(music, t, mtof(ev.m), ev.len * S.step * 0.92, S.lead).connect(sendFx);
        // Deuxième anche légèrement désaccordée : le son « musette » de l'accordéon.
        if (S.detune) fm(music, t, mtof(ev.m) * (1 + S.detune), ev.len * S.step * 0.92, S.lead);
      }
    }
    function tick() {
      if (!ac || !on) return;
      const now = ac.currentTime;
      if (nextT < now - 0.1) nextT = now + 0.05;
      while (nextT < now + 0.15) {

  const bests = { zen: +store.get('best', '0') || 0, defi: +store.get('best-defi', '0') || 0 };
  let gameMode = store.get('mode', 'zen') === 'defi' ? 'defi' : 'zen', saveT = 0;
  let deathT = 0, goT = 0, newRecord = false, runBest = 0, confetti = [], goButtons = [], modeBtn = null;
  // Mondes : world = décor affiché, genWorld = monde des plateformes générées.
  const WORLD_EVERY = 100, TRANS_DUR = 2.4, PLANE_DUR = 6;
  let world = 0, genWorld = 0, trans = null, plane = null, worldCard = 0, petals = [];

  function resetWorld() {
    platforms = [{ x: -300, w: 620, top: 0, s: 0, seed: 1 }];
    gems = []; particles = []; popups = []; puffs = []; trail = [];
    player = { x: 40, y: 0, vy: 0, grounded: true, canDouble: true, coyote: 0, hold: 0, lastTop: 0 };
    camX = player.x - W * 0.28;
    camY = camBase();
    world = 0; genWorld = 0; trans = null; plane = null; worldCard = 0; petals = [];
    ev = null; evFx = []; evSeg = -1; shake = 0;
    Sound.setSong(0);
    while (lastPlat().x + lastPlat().w < camX + W + 200) genNext();
  }
  const lastPlat = () => platforms[platforms.length - 1];

  function genNext() {
    const last = lastPlat();
    const top = clamp(Math.round(last.top + rand(-26, 34)), -70, 70);
    const dy = top - last.top;
    const t = (JUMP_V + Math.sqrt(JUMP_V * JUMP_V + 2 * G * dy)) / G;
    const reach = (speed + 10) * t;
    const gap = Math.round(rand(Math.min(24, reach * 0.4), reach * 0.8));
    const pl = { x: last.x + last.w + gap, w: Math.round(rand(80, 220)), top, s: genWorld * 3 + ((Math.random() * 3) | 0), seed: (Math.random() * 1e9) | 0 };
    platforms.push(pl);
    if (Math.random() < 0.6) {
      const n = 3 + ((Math.random() * 3) | 0), x0 = last.x + last.w - 6, span = gap + 12;
      for (let k = 1; k <= n; k++) {
        const f = k / (n + 1);
        gems.push({ x: x0 + span * f, y: Math.min(last.top, top) - 22 - Math.sin(Math.PI * f) * 24, ph: Math.random() * 6 });
      }
    }
    if (Math.random() < 0.5) {
      const n = 3 + ((Math.random() * 3) | 0), x0 = pl.x + 20 + Math.random() * Math.max(0, pl.w - 40 - n * 14);
      for (let k = 0; k < n; k++) gems.push({ x: x0 + k * 14, y: pl.top - 16, ph: Math.random() * 6 });
    }
  }

  // Changement de monde : un rideau de nuages traverse l'écran, le décor change quand il couvre tout.
  const curtainX = () => W + 30 - (trans.t / TRANS_DUR) * (W * 2.6 + 60);
  function startTransition(to) {
    trans = { t: 0, to, switched: false };
    genWorld = to;
    Sound.whoosh();
  }
  function switchWorld(w) {
    world = w;
    ev = null; evFx = []; shake = 0;
    for (const pl of platforms) { pl.s = w * 3 + (pl.s % 3); pl.img = null; }
    Sound.setSong(w);
    plane = { t: 0 };
    worldCard = 3;
    petals = [];
    if (w === 1) for (let i = 0; i < 26; i++) petals.push({ x: rand(0, W), y: rand(0, H), ph: rand(0, 6) });
    if (w === 3) for (let i = 0; i < 40; i++) petals.push({ x: rand(0, W), y: rand(0, H), ph: rand(0, 6), rain: true });
  }
  function updateWorld(dt) {
    updateEvent(dt);
    if (trans) {
      trans.t += dt;
      if (!trans.switched && curtainX() <= -30) { trans.switched = true; switchWorld(trans.to); }
      if (trans.t >= TRANS_DUR) trans = null;
    }
    if (plane) { plane.t += dt; if (plane.t > PLANE_DUR) plane = null; }
    if (worldCard > 0) worldCard -= dt;
    for (const q of petals) {
      if (q.rain) { q.x -= (25 + speed * 0.2) * dt; q.y += 130 * dt; }
      else {
        q.x += (-16 - speed * 0.15) * dt + Math.sin(time * 2 + q.ph) * 8 * dt;
        q.y += 14 * dt;
      }
      if (q.x < -4) q.x += W + 8;
      if (q.y > H + 2) { q.y = -4; q.x = rand(0, W + 20); }
    }
  }

  // Mode Défi : le personnage se fige, saute la tête en bas et tombe, puis l'écran de fin arrive.
  function die() {
    mode = 'dying'; deathT = 0; holding = false; jumpBuffer = 0;
    player.vy = 0; player.deadJump = false;
    btnPause.hidden = true; btnHome.hidden = true;
    Sound.stop(); Sound.die();
    burst(player.x, player.y - 16, 16, ['#ffe45c', '#ffffff', '#ff9ecf'], 80, 0);
    store.set(BEST_KEY[gameMode], bests[gameMode]);
  }
  function gameOver() {
    mode = 'gameover'; goT = 0;
    const dist = Math.floor((player.x - distStart) / 16);
    newRecord = dist > runBest && dist > 0;
    confetti = [];
    for (let i = 0; i < 70; i++) confetti.push({ x: rand(0, W), y: rand(-H, 0), vy: rand(20, 45), ph: rand(0, 6), col: RAINBOW[i % 6] });
    Sound.fanfare();
  }
  function updateEnd(dt) {
    const p = player;
    if (mode === 'dying') {
      deathT += dt;
      if (deathT > 0.45) {
        if (!p.deadJump) { p.deadJump = true; p.vy = -280; }
        p.vy += G * 0.8 * dt;
        p.y += p.vy * dt;
      }
      if (deathT > 2) gameOver();
    } else {
      goT += dt;
      for (const q of confetti) {
        q.y += q.vy * dt;
        q.x += Math.sin(time * 2 + q.ph) * 10 * dt;
        if (q.y > H + 4) { q.y = -4; q.x = rand(0, W); }
      }
    }
    updateWorld(dt);
    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    for (const q of popups) { q.y -= 14 * dt; q.life -= dt * 0.8; }
    popups = popups.filter(q => q.life > 0);
  }

  function burst(x, y, n, colors, spd, grav) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rand(spd * 0.4, spd);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: grav, life: rand(0.35, 0.7), col: colors[i % colors.length] });
    }
  }
  function popup(x, y, txt) { popups.push({ x, y, txt, life: 1 }); }

  function doJump(v) {
    const p = player;
    p.vy = -v; p.grounded = false; p.coyote = 0;
    p.hold = holding ? 0.22 : 0;
  }

  function nextPlatformAhead() {
    for (const pl of platforms) if (pl.x + pl.w > player.x + HW) return pl;
    return lastPlat();
  }

  function rescue() {
    const p = player, pl = nextPlatformAhead();
    const h = Math.max(40, p.y - (pl.top - 26));
    p.vy = -Math.sqrt(2 * G * h);
    p.canDouble = true; p.hold = 0;
    puffs.push({ x: p.x, y: p.y, life: 1 });
    burst(p.x, p.y, 10, ['#ffffff', '#f3e6ff', '#d9c6f0'], 60, 0);
    popup(p.x, p.y - 34, 'POUF !');
    streak = 0;
    Sound.boing();
  }

  function step(dt) {
    time += dt;
    if (mode === 'dying' || mode === 'gameover') { updateEnd(dt); return; }
    const p = player;
    if (mode === 'play') speed = Math.min(135, speed + dt * 0.45);

    // Pilote automatique sur l'écran titre.
    if (mode === 'title') {
      const nxt = nextPlatformAhead();
      const under = platforms.find(pl => p.x + HW > pl.x && p.x - HW < pl.x + pl.w && Math.abs(p.y - pl.top) < 1);
      if (p.grounded && under && under.x + under.w - p.x < 8) jumpBuffer = 0.1;
      if (!p.grounded && p.vy > 0 && p.canDouble && p.x + HW < nxt.x && p.y > nxt.top - 4) jumpBuffer = 0.1;
    }

    // Saut, saut tamponné et double saut.
    if (jumpBuffer > 0) {
      if (p.grounded || p.coyote > 0) {
        doJump(JUMP_V); p.canDouble = true; jumpBuffer = 0;
        burst(p.x, p.y, 4, ['#ffffff', '#ffe6f2'], 30, 60);
        Sound.jump();
      } else if (p.canDouble) {
        doJump(DJUMP_V); p.canDouble = false; jumpBuffer = 0;
        burst(p.x, p.y - 10, 12, RAINBOW, 70, 0);
        Sound.djump();
      } else {
        jumpBuffer -= dt;
      }
    }

    let g = G;
    if (holding && p.hold > 0 && p.vy < 0) { g *= 0.45; p.hold -= dt; }
    p.vy = Math.min(520, p.vy + g * dt);

    // Déplacement horizontal, avec petit coup de pouce sur les marches.
    let nx = p.x + speed * dt;
    for (const pl of platforms) {
      if (p.x + HW <= pl.x + 0.5 && nx + HW > pl.x && p.y > pl.top + 0.5) {
        if (p.y - pl.top <= 10) { p.y = pl.top; p.vy = 0; }
        else nx = pl.x - HW;
      }
    }
    // Déplacement vertical et atterrissage.
    let ny = p.y + p.vy * dt;
    const wasGrounded = p.grounded;
    p.grounded = false;
    if (p.vy >= 0) {
      for (const pl of platforms) {
        if (nx + HW > pl.x && nx - HW < pl.x + pl.w && p.y <= pl.top + 0.5 && ny >= pl.top) {
          ny = pl.top; p.vy = 0; p.grounded = true;
          if (!wasGrounded) {
            p.lastTop = pl.top; p.canDouble = true;
            burst(nx, ny, 6, STYLES[pl.s].top, 40, 120);
            Sound.land();
          }
          break;
        }
      }
    }
    p.x = nx; p.y = ny;
    p.coyote = p.grounded ? 0.1 : p.coyote - dt;

    const nxt = nextPlatformAhead();
    if (!p.grounded && p.vy > 0 && p.y > Math.max(p.lastTop, nxt.top) + 70) {
      if (mode === 'play' && gameMode === 'defi') { die(); return; }
      rescue();
    }

    // Étoiles à ramasser.
    streakT -= dt;
    if (streakT <= 0) streak = 0;
    for (const s of gems) {
      if (s.taken) continue;
      const dx = s.x - p.x, dy = s.y - (p.y - 16);
      if (dx * dx + dy * dy < 169) {
        s.taken = true;
        if (mode === 'play') starsCount++;
        Sound.star(streak);
        streak++; streakT = 1.2;
        burst(s.x, s.y, 8, ['#ffe45c', '#ffffff', '#ffb3d9'], 50, 0);
        if (streak > 0 && streak % 5 === 0) popup(s.x, s.y - 10, ['SUPER !', 'GENIAL !', 'BRAVO !', 'WAOUH !'][(streak / 5 - 1) % 4]);
      }
    }

    // Traînée arc-en-ciel.
    const ty0 = p.y - hero().trail;
    if (!trail.length || p.x - trail[trail.length - 1].x >= 1) trail.push({ x: p.x, y: ty0 });
    else trail[trail.length - 1].y = ty0;
    while (trail.length > 2 && trail[1].x < camX - 8) trail.shift();
    sparkT -= dt;
    if (sparkT <= 0) {
      sparkT = 0.07;
      particles.push({ x: p.x - 10, y: ty0 + rand(0, 12), vx: -6, vy: rand(-8, 8), g: 0, life: rand(0.5, 0.9), col: Math.random() < 0.5 ? '#ffffff' : '#fff3b0' });
    }

    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    for (const q of popups) { q.y -= 14 * dt; q.life -= dt * 0.8; }
    popups = popups.filter(q => q.life > 0);
    for (const q of puffs) q.life -= dt * 0.9;
    puffs = puffs.filter(q => q.life > 0);

    // Caméra.
    camX = p.x - W * 0.28;
    let ty = p.lastTop - H * 0.66;
    ty = Math.min(ty, p.y - 50);
    ty = Math.max(ty, p.y - H + 24);
    camY += (ty - camY) * Math.min(1, dt * 4);

    // Génération et nettoyage.
    while (lastPlat().x + lastPlat().w < camX + W + 160) genNext();
    while (platforms.length > 1 && platforms[0].x + platforms[0].w < camX - 60) platforms.shift();
    gems = gems.filter(s => !s.taken && s.x > camX - 20);

    updateWorld(dt);
    if (mode === 'play') {
      const dist = Math.floor((p.x - distStart) / 16);
      const target = Math.floor(dist / WORLD_EVERY) % WORLDS.length;
      if (target !== genWorld && !trans) startTransition(target);
      const seg = Math.floor(dist / WORLD_EVERY);
      if (dist % WORLD_EVERY >= WORLD_EVERY / 2 && seg !== evSeg && !trans && world === genWorld) { evSeg = seg; startEvent(world); }
      if (dist > bests[gameMode]) bests[gameMode] = dist;
      saveT -= dt;
      if (saveT <= 0) { saveT = 2; store.set(BEST_KEY[gameMode], bests[gameMode]); }
    }
  }

  // ---------- Dessin ----------
  function text(s, x, y, size, color, align) {
    ctx.font = size + 'px "Press Start 2P", ui-monospace, Menlo, monospace';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = OUT;
    ctx.fillText(s, x + 1, y); ctx.fillText(s, x - 1, y); ctx.fillText(s, x, y + 1); ctx.fillText(s, x, y - 1); ctx.fillText(s, x + 1, y + 1);
    ctx.fillStyle = color;
    ctx.fillText(s, x, y);
  }
  function rainbowText(s, cx, y, size) {
    ctx.font = size + 'px "Press Start 2P", ui-monospace, Menlo, monospace';
    const chars = [...s], ws = chars.map(c => ctx.measureText(c).width);
    let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
    chars.forEach((c, i) => {
      const yy = y + Math.round(Math.sin(time * 4 + i * 0.6) * 2);
      text(c, Math.round(x), yy, size, RAINBOW[(i + Math.floor(time * 4)) % 6]);
      x += ws[i];
    });
  }

  function drawHills() {
    const vOff = camY - camBase();
    const layer = (par, base, col, top, fn) => {
      const off = Math.round(camX * par), ys = [];
      ctx.fillStyle = col;
      for (let x = 0; x < W; x++) {
        const y = Math.round(base - fn(x + off));
        ys.push(y);
        ctx.fillRect(x, y + 2, 1, H - y);
      }
      ctx.fillStyle = top;
      for (let x = 0; x < W; x++) ctx.fillRect(x, ys[x], 1, 2);
    };
    layer(0.12, H * 0.62 - vOff * 0.12, '#b896ea', '#e2d0fa', w => 16 + 18 * Math.abs(Math.sin(w / 34)) + 6 * Math.abs(Math.sin(w / 11 + 2)));
    layer(0.3, H * 0.8 - vOff * 0.3, '#86cbe0', '#dff6fb', w => 10 + 14 * Math.abs(Math.sin(w / 22 + 1)) + 4 * Math.sin(w / 7));
  }
  function drawSkyStars() {
    const span = W + 50, off = Math.round(camX * 0.05), band = Math.max(1, (H * 0.45) | 0);
    for (let i = 0; i < 40; i++) {
      let x = ((hash(i * 7 + 1) % span) - off) % span;
      if (x < 0) x += span;
      x -= 25;
      const y = hash(i * 13 + 5) % band, tw = (time * 1.5 + i * 0.37) % 3;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x, y, 1, 1);
      if (tw < 0.4) { ctx.fillStyle = '#fff3b0'; ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); }
    }
  }
  function drawBgClouds() {
    const vOff = camY - camBase(), off = Math.round(camX * 0.4), sp = 150;
    const i0 = Math.floor((off - 120) / sp);
    for (let i = i0; i < i0 + Math.ceil(W / sp) + 3; i++) {
      const spr = clouds[hash(i) % 3];
      const x = i * sp + (hash(i + 11) % 70) - off;
      const y = Math.round(8 + (hash(i + 29) % Math.max(20, (H * 0.4) | 0)) - vOff * 0.2);
      ctx.drawImage(spr, x, y);
    }
  }
  function drawPlatforms() {
    const bottom = camY + H + 2;
    for (const pl of platforms) {
      if (pl.x + pl.w < camX - 4 || pl.x > camX + W + 4) continue;
      if (!pl.img) pl.img = buildPlatform(pl);
      ctx.drawImage(pl.img, pl.x - 1, pl.top);
      if (bottom > pl.top + DEPTH) {
        ctx.fillStyle = STYLES[pl.s].deep;
        ctx.fillRect(pl.x - 1, pl.top + DEPTH, pl.w + 2, bottom - pl.top - DEPTH);
      }
    }
  }
  function drawTrail() {
    const p = player;
    let j = trail.length - 1;
    for (let x = Math.round(p.x) - 6; x > camX - 4; x -= 2) {
      while (j > 0 && trail[j].x > x) j--;
      if (j < 0 || trail[j].x > x) break;
      const wob = ((Math.floor(x / 8) + Math.floor(time * 6)) & 1);
      const y = Math.round(trail[j].y) + wob;
      for (let i = 0; i < 6; i++) { ctx.fillStyle = RAINBOW[i]; ctx.fillRect(x - 2, y + i * 2, 2, 2); }
    }
  }
  function drawPlayer() {
    const p = player;
    if (mode === 'dying') {
      // Yeux fermés, puis la tête en bas pendant la chute.
      const spr = hero().framesB[0];
      if (!p.deadJump) { ctx.drawImage(spr, Math.round(p.x) - (spr.width >> 1), Math.round(p.y) - spr.height); return; }
      ctx.save();
      ctx.translate(Math.round(p.x), Math.round(p.y) - spr.height);
      ctx.scale(1, -1);
      ctx.drawImage(spr, -(spr.width >> 1), -spr.height);
      ctx.restore();
      return;
    }
    const spr = idleSprite(hero(), (time % 3.2) < 0.12);
    ctx.drawImage(spr, Math.round(p.x) - (spr.width >> 1), Math.round(p.y) - spr.height);
  }

  // Grand arc-en-ciel de fond, posé derrière les collines.
  let rainbowC = mk(1, 1), rainbowR = 0;
  function buildRainbow() {
    const R = Math.round(Math.min(W * 0.42, H * 0.5)), band = 4, outer = R + band * 6;
    const c = mk(outer * 2, outer), g = c.getContext('2d');
    const pastel = RAINBOW.map(hx => { const [r, gg, b] = hexRgb(hx); return `rgb(${(r + 255) >> 1},${(gg + 255) >> 1},${(b + 255) >> 1})`; });
    for (let y = 0; y < outer; y++) {
      for (let x = 0; x < outer * 2; x++) {
        const dist = Math.hypot(x + 0.5 - outer, outer - y - 0.5);
        const i = Math.floor((outer - dist) / band);
        if (i >= 0 && i < 6) { g.fillStyle = pastel[i]; g.fillRect(x, y, 1, 1); }
      }
    }
    rainbowC = c; rainbowR = outer;
  }
  function drawRainbow() {
    const vOff = camY - camBase();
    ctx.globalAlpha = 0.7;
    ctx.drawImage(rainbowC, Math.round(W * 0.68 - rainbowR), Math.round(H * 0.7 - rainbowR - vOff * 0.08));
    ctx.globalAlpha = 1;
  }

  // Bande de décor répétée à l'infini, avec parallaxe ; on remplit dessous avec « fill ».
  function drawStrip(c, par, base, fill) {
    const tw = c.width, off = ((Math.round(camX * par) % tw) + tw) % tw, b = Math.round(base), y = b - c.height;
    for (let x = -off; x < W; x += tw) ctx.drawImage(c, x, y);
    if (b < H) { ctx.fillStyle = fill; ctx.fillRect(0, b, W, H - b); }
  }
  function drawDisc(c, x, y) {
    const vOff = camY - camBase();
    ctx.drawImage(c, Math.round(x - c.width / 2), Math.round(y - c.height / 2 - vOff * 0.08));
  }
  function drawBackground() {
    const vOff = camY - camBase();
    ctx.drawImage(skyCs[world], 0, 0);
    drawSkyStars();
    if (world === 0) {
      drawRainbow();
      drawHills();
      drawBgClouds();
    } else if (world === 1) {
      drawDisc(sunC, W * 0.7, H * 0.3);
      drawBgClouds();
      drawStrip(fujiStrip, 0.1, H * 0.66 - vOff * 0.12, '#8f7bb9');
      drawStrip(bambooStrip, 0.3, H * 0.84 - vOff * 0.3, '#2f5a3c');
    } else if (world === 2) {
      drawDisc(moonC, W * 0.78, H * 0.2);
      drawBgClouds();
      drawStrip(skylineStrip, 0.1, H * 0.68 - vOff * 0.12, '#454c8a');
      drawStrip(cityStrip, 0.3, H * 0.84 - vOff * 0.3, '#3c3a6a');
    } else if (world === 3) {
      drawDisc(moonC, W * 0.24, H * 0.24);
      drawBgClouds();
      const far = H * 0.64 - vOff * 0.12;
      drawStrip(londonFar, 0.1, far, '#6f86b0');
      drawWater(far, '#6f86b0', '#c9d6ee');
      drawStrip(londonMid, 0.3, H * 0.88 - vOff * 0.3, '#4a5268');
    } else {
      drawDisc(sunC, W * 0.72, H * 0.42);
      drawBgClouds();
      const far = H * 0.64 - vOff * 0.12;
      drawStrip(parisFar, 0.1, far, '#7a83b8');
      drawEiffelSparkle(far);
      drawWater(far, '#7a83b8', '#ffd9b0');
      drawStrip(parisMid, 0.3, H * 0.78 - vOff * 0.3, '#5a5f75');
    }
  }
  const mod = (a, n) => ((a % n) + n) % n;
  // Reflets qui scintillent sur la Tamise ou la Seine.
  function drawWater(y0, deep, light) {
    const top = Math.round(y0), h = Math.max(1, H - top);
    ctx.fillStyle = light;
    for (let i = 0; i < 46; i++) {
      if (Math.floor(time * 2 + i) % 3 === 0) continue;
      const y = top + 2 + hash(i * 7 + 3) % Math.min(h, 40);
      const x = mod(hash(i * 13 + 1) - camX * 0.2 + time * 6, W + 40) - 20;
      ctx.fillRect(Math.round(x), y, 2 + hash(i) % 4, 1);
    }
  }
  // La tour Eiffel qui scintille au coucher du soleil.
  function drawEiffelSparkle(base) {
    const tw = parisFar.width, off = mod(Math.round(camX * 0.1), tw), bottom = Math.round(base) - 1;
    for (let x0 = -off; x0 < W; x0 += tw) {
      const cx = x0 + 200;
      if (cx < -30 || cx > W + 30) continue;
      for (let i = 0; i < 30; i++) {
        if (hash(i * 31 + Math.floor(time * 8)) % 3 !== 0) continue;
        const fb = hash(i * 17 + 5) % 95;
        const half = fb < 28 ? 22 - fb * 0.4 : fb < 60 ? 11 - (fb - 28) * 0.22 : Math.max(4 - (fb - 60) * 0.09, 0.6);
        const dx = ((hash(i * 7 + 1) % 1000) / 500 - 1) * half;
        ctx.fillStyle = i % 2 ? '#fff3b0' : '#ffffff';
        ctx.fillRect(Math.round(cx + dx), bottom - fb, 1, 1);
      }
    }
  }
  function drawPetals() {
    for (const q of petals) {
      if (q.rain) { ctx.fillStyle = '#e6eefa'; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 3); continue; }
      ctx.fillStyle = q.ph > 3 ? '#ffc0d9' : '#ff9ec4';
      if (Math.floor(time * 4 + q.ph) % 2) ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 1);
      else ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 2);
    }
  }
  // L'avion traverse le ciel en tirant une banderole avec le nom du monde.
  function drawPlane() {
    if (!plane) return;
    const name = WORLDS[world].name;
    ctx.font = '8px "Press Start 2P", ui-monospace, Menlo, monospace';
    const bw = Math.ceil(ctx.measureText(name).width) + 10, rope = 12, total = 22 + rope + bw;
    const x = Math.round(W + 10 - (plane.t / PLANE_DUR) * (W + total + 30));
    const y = Math.round(Math.max(safe.t + 34, H * 0.2) + Math.sin(plane.t * 3) * 2);
    ctx.drawImage(planeFrames[Math.floor(time * 20) % 2], x, y);
    ctx.fillStyle = '#5b4a6e';
    ctx.fillRect(x + 21, y + 4, rope, 1);
    const bx = x + 21 + rope, by = y - 1 + Math.round(Math.sin(plane.t * 6));
    ctx.fillStyle = OUT; ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = '#fff7d6'; ctx.fillRect(bx + 1, by + 1, bw - 2, 10);
    ctx.fillStyle = WORLDS[world].accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(name, bx + 5, by + 2);
  }
  // Rideau de nuages en pixels, bords festonnés.
  function drawCurtain() {
    if (!trans) return;
    const xf = curtainX(), xb = xf + W * 1.6;
    for (let y = 0; y < H; y += 3) {
      const jl = Math.round(8 * Math.abs(Math.sin(y / 11 + 1)) + 5 * Math.abs(Math.sin(y / 5)));
      const jr = Math.round(8 * Math.abs(Math.sin(y / 13 + 2)) + 5 * Math.abs(Math.sin(y / 6 + 1)));
      const l = Math.round(xf - jl), r = Math.round(xb + jr);
      ctx.fillStyle = '#d9c6f0'; ctx.fillRect(l, y, r - l, 3);
      ctx.fillStyle = '#f3e6ff'; ctx.fillRect(l + 2, y, r - l - 4, 3);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(l + 6, y, r - l - 12, 3);
    }
  }

  // Écran titre : choix du personnage.
  let cards = [];
  function drawTitle(cx) {
    const y0 = Math.round(Math.max(14, safe.t + 10, H * 0.06));
    rainbowText('GLACE', cx, y0, 16);
    rainbowText('LICORNE', cx, y0 + 21, 16);
    text('BARZOUTE GAMES', cx, y0 + 44, 8, '#ffffff', 'center');
    if (Math.floor(time * 2) % 2 === 0) text('CHOISIS TON PERSO', cx, y0 + 58, 8, '#fff3b0', 'center');
    const hint = Math.round(H - safe.b - 14);
    const top = y0 + 72, room = hint - 22 - top;
    const s = room >= 70 ? 2 : 1;
    const cw = Math.max(22 * s + 12, 62), ch = 32 * s + 8, gap = 6;
    const mby = Math.min(top + ch + 22, hint - 16);
    const total = CHARS.length * cw + (CHARS.length - 1) * gap;
    let x = Math.round(cx - total / 2);
    cards = [];
    CHARS.forEach((c, i) => {
      const sel = i === charIdx;
      ctx.fillStyle = sel ? 'rgba(122, 92, 160, 0.92)' : 'rgba(59, 37, 80, 0.88)';
      ctx.fillRect(x, top, cw, ch + 12);
      ctx.fillStyle = sel ? '#fff3b0' : '#ffffff';
      ctx.fillRect(x, top, cw, 1); ctx.fillRect(x, top + ch + 11, cw, 1);
      ctx.fillRect(x, top, 1, ch + 12); ctx.fillRect(x + cw - 1, top, 1, ch + 12);
      // Tous animés, décalés pour ne pas bouger ni cligner en même temps.
      const spr = idleSprite(c, ((time + i * 1.1) % 3.2) < 0.12, i);
      ctx.drawImage(spr, Math.round(x + cw / 2 - spr.width * s / 2), top + ch - spr.height * s, spr.width * s, spr.height * s);
      text(c.name, Math.round(x + cw / 2), top + ch + 2, 8, sel ? '#fff3b0' : '#ffffff', 'center');
      cards.push({ x, y: top, w: cw, h: ch + 12 });
      x += cw + gap;
    });
    // Bouton de mode : on le touche pour passer de ZEN à DÉFI.
    const zen = gameMode === 'zen';
    ctx.font = '8px "Press Start 2P", ui-monospace, Menlo, monospace';
    const bw = Math.ceil(ctx.measureText('< MODE DEFI >').width) + 12, bx = Math.round(cx - bw / 2);
    ctx.fillStyle = '#fff4e6'; ctx.fillRect(bx - 1, mby - 4, bw + 2, 16);
    ctx.fillStyle = zen ? '#3f8f78' : '#c83c6e'; ctx.fillRect(bx, mby - 3, bw, 14);
    text(zen ? '< MODE ZEN >' : '< MODE DEFI >', cx, mby, 8, '#ffffff', 'center');
    modeBtn = { x: bx - 4, y: mby - 8, w: bw + 8, h: 24 };
    const tip = Math.floor(time / 2.5) % 2 === 0 ? 'TAP = SAUT  2E TAP = DOUBLE'
      : (zen ? 'ZEN : UN NUAGE TE RATTRAPE' : 'DEFI : UNE CHUTE = GAME OVER');
    text(tip, cx, hint, 8, '#ffffff', 'center');
    if (bests[gameMode] > 0) text('RECORD ' + bests[gameMode] + ' M', Math.round(6 + safe.l), Math.round(6 + safe.t), 8, '#d6fff0');
  }

  // Écran de fin joyeux : confettis, personnage qui danse, score et deux boutons.
  function drawGameOver(cx) {
    ctx.fillStyle = 'rgba(31, 21, 51, 0.45)';
    ctx.fillRect(0, 0, W, H);
    for (const q of confetti) {
      ctx.fillStyle = q.col;
      ctx.fillRect(Math.round(q.x), Math.round(q.y), Math.floor(time * 6 + q.ph) % 2 ? 2 : 1, 2);
    }
    const s = H >= 230 ? 2 : 1, heroH = 32 * s;
    const ph = 8 + 18 + 14 + heroH + 8 + 12 + 12 + 6 + 20 + 8, pw = Math.min(W - 16, 228);
    const px = Math.round(cx - pw / 2);
    let y = Math.round(Math.max(safe.t + 4, (H - ph) / 2));
    ctx.fillStyle = '#fff4e6'; ctx.fillRect(px - 1, y - 1, pw + 2, ph + 2);
    ctx.fillStyle = '#5b3f86'; ctx.fillRect(px, y, pw, ph);
    y += 8;
    rainbowText('GAME OVER', cx, y, 16);
    y += 18;
    if (!newRecord || Math.floor(time * 3) % 2 === 0) text(newRecord ? 'NOUVEAU RECORD !' : 'BRAVO !', cx, y, 8, '#fff3b0', 'center');
    y += 14;
    const spr = idleSprite(hero(), false), hop = Math.round(Math.abs(Math.sin(goT * 5)) * 6);
    ctx.drawImage(spr, Math.round(cx - spr.width * s / 2), y + heroH - spr.height * s - hop, spr.width * s, spr.height * s);
    if (Math.floor(time * 4) % 2) { ctx.drawImage(sprStar, cx - 30, y + 6); ctx.drawImage(sprStar, cx + 23, y + 14); }
    else { ctx.drawImage(sprStar, cx - 26, y + 14); ctx.drawImage(sprStar, cx + 19, y + 6); }
    y += heroH + 8;
    const dist = Math.floor((player.x - distStart) / 16);
    text(dist + ' M', cx - 8, y, 8, '#ffffff', 'right');
    ctx.drawImage(sprStar, cx + 2, y);
    text(String(starsCount), cx + 13, y, 8, '#ffffff');
    y += 12;
    text('RECORD ' + bests[gameMode] + ' M', cx, y, 8, '#d6fff0', 'center');
    y += 18;
    const bw = Math.min(90, Math.floor((pw - 24) / 2)), bh = 20;
    goButtons = [
      { x: cx - bw - 4, y, w: bw, h: bh, act: 'replay', label: 'REJOUER', col: '#ff5fa2' },
      { x: cx + 4, y, w: bw, h: bh, act: 'menu', label: 'MENU', col: '#4db8ff' }
    ];
    ctx.globalAlpha = goT > 0.8 ? 1 : 0.5;
    for (const b of goButtons) {
      ctx.fillStyle = '#fff4e6'; ctx.fillRect(b.x - 1, b.y - 1, b.w + 2, b.h + 2);
      ctx.fillStyle = b.col; ctx.fillRect(b.x, b.y, b.w, b.h);
      text(b.label, Math.round(b.x + b.w / 2), b.y + 6, 8, '#ffffff', 'center');
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (shake > 0.3 && !reduceMotion && !paused) {
      ctx.fillStyle = '#1f1533'; ctx.fillRect(0, 0, W, H);
      ctx.translate(Math.round((Math.random() * 2 - 1) * shake), Math.round((Math.random() * 2 - 1) * shake));
    }
    drawBackground();
    drawEvent();
    drawPlane();

    ctx.save();
    ctx.translate(-Math.round(camX), -Math.round(camY));
    for (const q of puffs) {
      ctx.globalAlpha = clamp(q.life, 0, 1);
      ctx.drawImage(puff, Math.round(q.x) - 14, Math.round(q.y) - 6);
    }
    ctx.globalAlpha = 1;
    drawPlatforms();
    for (const s of gems) ctx.drawImage(sprStar, Math.round(s.x) - 3, Math.round(s.y - 3 + Math.sin(time * 4 + s.ph) * 1.5));
    ctx.restore();
    drawPetals();
    drawCurtain();

    // Le personnage reste visible par-dessus les nuages.
    ctx.save();
    ctx.translate(-Math.round(camX), -Math.round(camY));
    drawTrail();
    drawPlayer();
    for (const q of particles) { ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1); }
    for (const q of popups) {
      ctx.globalAlpha = clamp(q.life * 2, 0, 1);
      text(q.txt, Math.round(q.x), Math.round(q.y), 8, '#fff7d6', 'center');
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    const cx = Math.round(W / 2);
    if (mode === 'play' || mode === 'dying') {
      const x = Math.round(6 + safe.l), y = Math.round(6 + safe.t);
      ctx.drawImage(sprStar, x, y);
      text(String(starsCount), x + 11, y, 8, '#fff7d6');
      text(Math.floor((player.x - distStart) / 16) + ' M', x, y + 13, 8, '#fff7d6');
      if (gameMode === 'defi') text('DEFI', x, y + 26, 8, '#ff9ecf');
      if (worldCard > 0) {
        ctx.globalAlpha = clamp(worldCard / 0.5, 0, 1);
        const cy = Math.round(Math.max(safe.t + 52, H * 0.3));
        rainbowText('MONDE ' + (world + 1), cx, cy, 16);
        text(WORLDS[world].name, cx, cy + 22, 8, '#fff7d6', 'center');
        ctx.globalAlpha = 1;
      }
    } else if (mode === 'gameover') {
      drawGameOver(cx);
    } else {
      drawTitle(cx);
    }
    if (paused) {
      ctx.fillStyle = 'rgba(31, 21, 51, 0.55)';
      ctx.fillRect(0, 0, W, H);
      text('PAUSE', cx, Math.round(H / 2 - 14), 16, '#ffffff', 'center');
      text('TOUCHE POUR REPRENDRE', cx, Math.round(H / 2 + 8), 8, '#fff3b0', 'center');
    }
  }

  // ---------- Boucle ----------
  let lastT = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.1) dt = 0.1;
    if (!paused) {
      acc += dt;
      while (acc >= DT) { step(DT); acc -= DT; }
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Commandes ----------
  const SOUND_ON = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="currentColor"/><rect x="3" y="3" width="1" height="6" fill="currentColor"/><rect x="4" y="2" width="1" height="8" fill="currentColor"/><rect x="5" y="1" width="1" height="10" fill="currentColor"/><rect x="7" y="5" width="1" height="2" fill="currentColor"/><rect x="8" y="3" width="1" height="1" fill="currentColor"/><rect x="9" y="4" width="1" height="4" fill="currentColor"/><rect x="8" y="8" width="1" height="1" fill="currentColor"/></svg>';
  const SOUND_OFF = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="currentColor"/><rect x="3" y="3" width="1" height="6" fill="currentColor"/><rect x="4" y="2" width="1" height="8" fill="currentColor"/><rect x="5" y="1" width="1" height="10" fill="currentColor"/><rect x="7" y="4" width="1" height="1" fill="currentColor"/><rect x="8" y="5" width="1" height="2" fill="currentColor"/><rect x="9" y="4" width="1" height="1" fill="currentColor"/><rect x="7" y="7" width="1" height="1" fill="currentColor"/><rect x="9" y="7" width="1" height="1" fill="currentColor"/></svg>';
  function renderSoundBtn() {
    btnSound.innerHTML = Sound.muted ? SOUND_OFF : SOUND_ON;
    btnSound.setAttribute('aria-label', Sound.muted ? 'Remettre le son' : 'Couper le son');
  }
  function setPaused(v) {
    if (mode !== 'play') return;
    paused = v;
    btnPause.setAttribute('aria-label', v ? 'Reprendre' : 'Pause');
    if (v) { Sound.stop(); holding = false; }
    else { Sound.resume(); Sound.start(); lastT = performance.now(); }
  }
  function pick(i) {
    charIdx = (i + CHARS.length) % CHARS.length;
    store.set('perso', charIdx);
  }
  function startGame() {
    mode = 'play';
    distStart = player.x; starsCount = 0; speed = 80; streak = 0; runBest = bests[gameMode]; evSeg = -1;
    if (genWorld !== 0) { if (!trans) startTransition(0); }
    else if (!trans) worldCard = 3;
    btnPause.hidden = false; btnHome.hidden = false;
    Sound.start();
  }
  function goTitle() {
    if (mode !== 'play') return;
    if (paused) setPaused(false);
    mode = 'title'; speed = 70; holding = false;
    btnPause.hidden = true; btnHome.hidden = true;
  }
  function toggleMode() {
    gameMode = gameMode === 'zen' ? 'defi' : 'zen';
    store.set('mode', gameMode);
    Sound.jump();
  }
  function restart() {
    resetWorld();
    startGame();
  }
  function backToMenu() {
    resetWorld();
    mode = 'title'; speed = 70;
    btnPause.hidden = true; btnHome.hidden = true;
  }
  const hit = (r, x, y) => r && x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
  function press(e) {
    Sound.init();
    const lx = e ? e.clientX / SCALE : -1, ly = e ? e.clientY / SCALE : -1;
    if (mode === 'dying') return;
    if (mode === 'gameover') {
      if (goT < 0.8) return;
      const b = e ? goButtons.find(r => hit(r, lx, ly)) : goButtons[0];
      if (!b) return;
      if (b.act === 'replay') restart(); else backToMenu();
      return;
    }
    if (mode === 'title') {
      if (e && hit(modeBtn, lx, ly)) { toggleMode(); return; }
      if (e) {
        const i = cards.findIndex(c => hit(c, lx, ly));
        if (i >= 0) pick(i);
      }
      startGame();
      return;
    }
    if (paused) { setPaused(false); return; }
    holding = true;
    jumpBuffer = 0.12;
  }
  function release() { holding = false; }

  window.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    press(e);
  }, { passive: false });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  document.addEventListener('touchstart', e => {
    if (!(e.target.closest && e.target.closest('button'))) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  // Sur iOS, l'audio ne démarre qu'après un geste « complet » : on relance au relâchement.
  document.addEventListener('touchend', () => Sound.init());
  document.addEventListener('click', () => Sound.init());

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      if (!e.repeat) press();
    } else if (mode === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      pick(charIdx + (e.code === 'ArrowLeft' ? -1 : 1));
    } else if (mode === 'title' && e.code === 'ArrowDown') {
      toggleMode();
    } else if (mode === 'gameover' && e.code === 'Escape') {
      if (goT >= 0.8) backToMenu();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      setPaused(!paused);
    } else if (e.code === 'KeyM') {
      Sound.init(); Sound.setMuted(!Sound.muted); renderSoundBtn();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') release();
  });

  btnSound.addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); renderSoundBtn(); });
  btnPause.addEventListener('click', () => { Sound.init(); setPaused(!paused); });
  btnHome.addEventListener('click', () => { Sound.init(); goTitle(); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { setPaused(true); Sound.suspend(); store.set(BEST_KEY[gameMode], bests[gameMode]); }
  });
  window.addEventListener('resize', resize);

  resize();
  resetWorld();
  renderSoundBtn();
  requestAnimationFrame(frame);
})();
</script>
<!-- ARTIFACT-END -->
</body>
</html>
