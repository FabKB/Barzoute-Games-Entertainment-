<!doctype html>
<html lang="fr">
<head>

<title>Glace Licorne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Plein écran : un seul canvas pixel art, deux boutons flottants. */
  :root {
    --night: #1f1533;
    --ink: #3b2550;
    --cream: #fff4e6;
    --pink: #ff9ecf;
    --pixel: "Press Start 2P", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--night);
    color: var(--cream);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
  #game { display: block; }
  .btns {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .btns button {
    width: 44px;
    height: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    background: var(--ink);
    border: 3px solid var(--cream);
    color: var(--cream);
    cursor: pointer;
    clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
  }
  .btns button[hidden] { display: none; }
  .btns button:active { background: var(--pink); color: var(--ink); }
  .btns button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  .btns svg { width: 24px; height: 24px; shape-rendering: crispEdges; }
  #safe {
    position: fixed;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" role="img" aria-label="Jeu Glace Licorne : touche l'écran pour sauter de plateforme en plateforme"></canvas></div>
<div class="btns">
  <button id="btnHome" type="button" aria-label="Changer de personnage" hidden>
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="5" y="1" width="2" height="1" fill="currentColor"/><rect x="4" y="2" width="4" height="1" fill="currentColor"/><rect x="3" y="3" width="6" height="1" fill="currentColor"/><rect x="2" y="4" width="8" height="1" fill="currentColor"/><rect x="1" y="5" width="10" height="1" fill="currentColor"/><rect x="2" y="6" width="8" height="5" fill="currentColor"/><rect x="5" y="8" width="2" height="3" fill="#3b2550"/></svg>
  </button>
  <button id="btnPause" type="button" aria-label="Pause" hidden>
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="3" y="2" width="2" height="8" fill="currentColor"/><rect x="7" y="2" width="2" height="8" fill="currentColor"/></svg>
  </button>
  <button id="btnSound" type="button" aria-label="Couper le son"></button>
</div>
<div id="safe" aria-hidden="true"></div>
<script>
(() => {
  'use strict';

  // ---------- Utilitaires ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function hash(n) {
    n |= 0;
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    return (n ^ (n >>> 16)) >>> 0;
  }
  const store = {
    get(k, d) { try { const v = localStorage.getItem('glace-licorne:' + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('glace-licorne:' + k, String(v)); } catch (e) { /* stockage indisponible */ } }
  };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

  // ---------- Son : synthé FM façon Mega Drive ----------
  const Sound = (() => {
    const BPM = 132, STEP = 60 / BPM / 4;
    let ac = null, master, music, sfx, sendFx, noise;
    let muted = store.get('muted', '0') === '1';
    let timer = 0, step = 0, nextT = 0, on = false;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    const n2m = s => { const m = s.match(/^([A-G])(#?)(\d)$/); return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0); };
    const CH = {
      C: { b: 48, a: [60, 64, 67, 72] },
      G: { b: 43, a: [55, 59, 62, 67] },
      Am: { b: 45, a: [57, 60, 64, 69] },
      F: { b: 41, a: [53, 57, 60, 65] }
    };
    const PROG = ['C', 'G', 'Am', 'F', 'C', 'G', 'F', 'G', 'Am', 'F', 'C', 'G', 'Am', 'F', 'G', 'G'];
    // Une mesure = 8 croches. "-" prolonge la note, "." est un silence.
    const MEL = [
      'E5 G5 C6 G5 E5 G5 C6 D6', 'B5 - G5 - D5 G5 B5 D6', 'C6 - A5 - E5 A5 C6 E6', 'D6 C6 A5 F5 A5 - . .',
      'G5 E5 G5 C6 E6 - D6 C6', 'D6 - B5 G5 B5 D6 G6 -', 'F6 E6 D6 C6 A5 C6 F6 -', 'G6 - F6 - D6 - B5 -',
      'A5 - C6 - E6 - D6 C6', 'C6 - A5 - F5 - A5 -', 'G5 - E5 G5 C6 - E6 -', 'D6 - - - B5 - G5 -',
      'A5 C6 E6 A6 G6 E6 C6 A5', 'F5 A5 C6 F6 E6 C6 A5 F5', 'G5 B5 D6 G6 F6 D6 B5 G5', 'D6 - E6 - F6 - G6 -'
    ];
    const LEN = PROG.length * 16;
    const SEQ = new Array(LEN).fill(null);
    (() => {
      let last = null;
      MEL.forEach((bar, b) => bar.split(' ').forEach((t, i) => {
        const s = b * 16 + i * 2;
        if (t === '-') { if (last) last.len += 2; }
        else if (t === '.') { last = null; }
        else { last = { m: n2m(t) - 12, len: 2 }; SEQ[s] = last; }
      }));
    })();

    function init() {
      if (ac) { if (ac.state !== 'running') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { ac = null; return; }
      const comp = ac.createDynamicsCompressor();
      comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(comp);
      music = ac.createGain(); music.gain.value = 0.5; music.connect(master);
      sfx = ac.createGain(); sfx.gain.value = 0.6; sfx.connect(master);
      const dl = ac.createDelay(1); dl.delayTime.value = STEP * 3;
      const fb = ac.createGain(); fb.gain.value = 0.3;
      const wet = ac.createGain(); wet.gain.value = 0.3;
      dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(music);
      sendFx = dl;
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // Débloque l'audio sur iOS avec un son vide.
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
      if (ac.state !== 'running') ac.resume();
    }

    function env(g, t, peak, a, d, sus, end, rel) {
      const p = g.gain, s = Math.max(0.0001, peak * sus);
      p.setValueAtTime(0.0001, t);
      p.linearRampToValueAtTime(peak, t + a);
      p.exponentialRampToValueAtTime(s, t + a + d);
      p.setValueAtTime(s, end);
      p.exponentialRampToValueAtTime(0.0001, end + rel);
    }
    function fm(dest, t, f, dur, o) {
      const car = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain(), g = ac.createGain();
      car.frequency.setValueAtTime(f, t);
      mod.frequency.setValueAtTime(f * o.ratio, t);
      mg.gain.setValueAtTime(f * o.index, t);
      mg.gain.exponentialRampToValueAtTime(Math.max(0.0001, f * o.index * o.idxSus), t + o.idxDecay);
      mod.connect(mg); mg.connect(car.frequency); car.connect(g); g.connect(dest);
      const end = Math.max(t + dur, t + o.a + o.d + 0.001);
      env(g, t, o.vol, o.a, o.d, o.sus, end, o.rel);
      if (o.glide) {
        car.frequency.exponentialRampToValueAtTime(f * o.glide, t + dur);
        mod.frequency.exponentialRampToValueAtTime(f * o.glide * o.ratio, t + dur);
      }
      const stop = end + o.rel + 0.05;
      car.start(t); mod.start(t); car.stop(stop); mod.stop(stop);
      return g;
    }
    const LEAD = { ratio: 1, index: 2.2, idxSus: 0.6, idxDecay: 0.15, vol: 0.2, a: 0.006, d: 0.12, sus: 0.7, rel: 0.08 };
    const BASS = { ratio: 1, index: 3.5, idxSus: 0.3, idxDecay: 0.09, vol: 0.32, a: 0.004, d: 0.1, sus: 0.55, rel: 0.05 };
    const BELL = { ratio: 3.5, index: 2.5, idxSus: 0.1, idxDecay: 0.25, vol: 0.16, a: 0.003, d: 0.2, sus: 0.3, rel: 0.15 };

    function playLead(t, m, dur) { fm(music, t, mtof(m), dur, LEAD).connect(sendFx); }
    function playBass(t, m, dur) { fm(music, t, mtof(m), dur, BASS); }
    function playArp(t, m) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = mtof(m);
      o.connect(g); g.connect(music);
      env(g, t, 0.045, 0.002, 0.05, 0.4, t + STEP * 0.8, 0.03);
      o.start(t); o.stop(t + STEP + 0.1);
    }
    function kick(t) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      o.connect(g); g.connect(music);
      g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.start(t); o.stop(t + 0.22);
    }
    function nz(t, dur, vol, type, freq, q, dest) {
      const s = ac.createBufferSource(); s.buffer = noise;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
      const g = ac.createGain();
      s.connect(f); f.connect(g); g.connect(dest || music);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function snare(t) {
      nz(t, 0.16, 0.28, 'bandpass', 1800, 0.8);
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
      o.connect(g); g.connect(music);
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.start(t); o.stop(t + 0.12);
    }
    function sched(s, t) {
      const bar = (s / 16) | 0, i = s % 16, ch = CH[PROG[bar]];
      if (i === 0 || i === 6 || i === 8 || (i === 14 && bar % 2 === 1)) kick(t);
      if (i === 4 || i === 12) snare(t);
      if (i % 2 === 0) {
        nz(t, 0.035, i % 4 === 2 ? 0.07 : 0.04, 'highpass', 7000);
        playBass(t, ch.b + [0, 12, 0, 12, 0, 12, 7, 12][i / 2], STEP * 1.6);
      }
      playArp(t, ch.a[i % 4] + 12);
      const ev = SEQ[s];
      if (ev) playLead(t, ev.m, ev.len * STEP * 0.92);
    }
    function tick() {
      if (!ac || !on) return;
      const now = ac.currentTime;
      if (nextT < now - 0.1) nextT = now + 0.05;
      while (nextT < now + 0.15) { sched(step, nextT); nextT += STEP; step = (step + 1) % LEN; }
    }
    function sweep(f0, f1, dur, vol) {
      if (!ac) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      o.connect(g); g.connect(sfx);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
      o.start(t); o.stop(t + dur + 0.08);
    }
    const PENTA = [0, 2, 4, 7, 9];

    return {
      init,
      get muted() { return muted; },
      setMuted(m) {
        muted = m; store.set('muted', m ? '1' : '0');
        if (ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(m ? 0 : 0.6, ac.currentTime, 0.03); }
      },
      start() { if (!ac || on) return; on = true; nextT = ac.currentTime + 0.08; tick(); timer = setInterval(tick, 25); },
      stop() { on = false; clearInterval(timer); },
      suspend() { if (ac && ac.state === 'running') ac.suspend(); },
      resume() { if (ac && ac.state !== 'running') ac.resume(); },
      jump() { sweep(320, 760, 0.11, 0.07); },
      djump() { sweep(520, 1300, 0.14, 0.06); },
      land() { if (ac) nz(ac.currentTime, 0.05, 0.08, 'lowpass', 700, 0, sfx); },
      star(n) { if (ac) fm(sfx, ac.currentTime, mtof(72 + PENTA[n % 5] + 12 * Math.min(2, (n / 5) | 0)), 0.12, BELL); },
      boing() { if (ac) fm(sfx, ac.currentTime, 180, 0.3, Object.assign({}, BASS, { vol: 0.25, glide: 3 })); }
    };
  })();

  // ---------- Sprites ----------
  const OUT = '#3b2550';
  const PAL = {
    K: OUT, W: '#ffffff', H: '#ffffff', P: '#ffc6de', p: '#f49cc4', Y: '#ffd84a', y: '#e9a42a',
    R: '#ff7fae', I: '#ff9fc9', B: '#59c3ff', G: '#6fe39a', C: '#f0b765', c: '#b8732f',
    O: '#e2851c', S: '#ffe45c',
    // Cigogne
    w: '#ffffff', g: '#d9d3e6', N: '#2a2433', r: '#e8392b', d: '#b3241a',
    // Faune
    f: '#fbf7f0', h: '#e08a4a', e: '#eadfce', u: '#f3ead9', n: '#e07a52', b: '#8a4a2a',
    v: '#3d4660', z: '#f4f1ea', o: '#4a5062', q: '#33384a', T: '#c2603a', t: '#953f22'
  };
  // La glace licorne, d'après le dessin : corne, oreilles de chat, grands yeux, cornet gaufré.
  const SCOOP = [
    '........K........',
    '.......KYK.......',
    '.......KyK.......',
    '..K...KYYYK...K..',
    '..KK..KyyyK..KK..',
    '..KIK.KKKKK.KIK..',
    '..KIIKPPPPPKIIK..',
    '.KPPPBPPPPPGPPPK.',
    '.KPWWPPPPPPPPPPK.',
    'KPWPKKPPPPPKKPPPK',
    'KPPKHKKPPPKHKKPPK',
    'KPPKKKKPPPKKKKPPK',
    'KPRPKKPPPPPKKPRPK',
    'KPPPPPKPKPKPPPPPK',
    'KPPPPPPKPKPPPPPPK',
    'KPPPPPKPPPKPPPPPK',
    'KPPPPPPKKKPPPPPPK',
    '.KpppppppppppppK.'
  ];
  function coneRows() {
    const rows = ['K' + 'c'.repeat(15) + 'K'];
    for (let i = 1; i < 12; i++) {
      const hw = Math.round(7 * (1 - i / 11));
      let r = '';
      for (let x = 0; x < 17; x++) {
        const d = Math.abs(x - 8);
        if (d > hw) r += '.';
        else if (d === hw) r += 'K';
        else r += ((x + i) % 4 === 0 || (x - i + 48) % 4 === 0) ? 'c' : 'C';
      }
      rows.push(r);
    }
    return rows;
  }
  const BODY = SCOOP.concat(coneRows());
  const BLINK = BODY.slice();
  BLINK[9] = 'KPWPPPPPPPPPPPPPK';
  BLINK[10] = 'KPPPPPPPPPPPPPPPK';
  BLINK[11] = 'KPPKKKKPPPKKKKPPK';
  BLINK[12] = 'KPRPPPPPPPPPPPRPK';
  const STAR = ['...O...', '..OSO..', '.OSWSO.', 'OSSSSSO', '.OSSSO.', '.OSOSO.', 'OO...OO'];

  // Le doudou cigogne : long bec rouge, aile noire, grandes pattes rouges.
  const STORK = [
    '.......KKKK.........',
    '......KwwwwK........',
    '.....KwwwwwwK.......',
    '.....KwwKwwwwKK.....',
    '.....KwwwwwwKrrrK...',
    '.....KwwwwwwKrrrrK..',
    '......KwwwwwKKdrrrK.',
    '......KwwwwK...KdrrK',
    '......KwwwwK.....KdK',
    '......KwwwwK........',
    '......KwwwwK........',
    '......KwwwgK........',
    '.....KwwwwgK........',
    '....KKwwwwwgKK......',
    '...KNNwwwwwwwgK.....',
    '..KNNNNwwwwwwwgK....',
    '.KNNNNNNwwwwwwwgK...',
    'KNNNNNNNwwwwwwwwgK..',
    'KNNNNNNwwwwwwwwwgK..',
    '.KNNNNwwwwwwwwwggK..',
    '..KKNwwwwwwwwwggK...',
    '....KKgwwwwwggKK....',
    '........rr..rr......',
    '........rr..rr......',
    '........rr..rr......',
    '........dd..dd......',
    '........rr..rr......',
    '........rr..rr......',
    '........rr..rr......',
    '........rr..rr......',
    '.......rrrr.rrrr....',
    '.......dddd.dddd....'
  ];
  const STORK_BLINK = STORK.slice();
  STORK_BLINK[3] = '.....KwwgwwwwKK.....';

  // Le doudou faune : petites cornes, grandes oreilles, foulard rayé, salopette, queue rousse.
  const FAUN = [
    '.......Kh...hK.......',
    '.......Khh.hhK.......',
    '......KffhfhffK......',
    '.KKK.KfffffffffK.KKK.',
    'KeeefKfffffffffKfeeeK',
    'KeeeeKfuuuuuuufKeeeeK',
    '.KeeKfuubuuubuufKeeK.',
    '..KKKfuubuuubuufKKK..',
    '.....KuuuuuuuuuK.....',
    '.....KuRuunuuRuK.....',
    '......KuuuuuuuK......',
    '.....KvvvvvvvvvK.....',
    '....KzzzzzzzzzzzK....',
    '....KvvvvvvvvvvvK....',
    '....KooozvzoooooK....',
    '...KuKooovzvoooKuK...',
    '.TTKuKoooooooooKuK...',
    'TTTKuKoooooooooKuK...',
    'TtTTKKoooqoooooKK....',
    '.TtTTKoooooooooK.....',
    '..TTTKoooooooooK.....',
    '.....KooooKooooK.....',
    '.....KqqqqKqqqqK.....',
    '.....KKuuKKKuuKK.....',
    '......KuuK.KuuK......',
    '......KuuK.KuuK......',
    '......KuuK.KuuK......',
    '......KuuK.KuuK......',
    '......KuuK.KuuK......',
    '......KKKK.KKKK......'
  ];
  const FAUN_BLINK = FAUN.slice();
  FAUN_BLINK[6] = '.KeeKfuuuuuuuuufKeeK.';
  FAUN_BLINK[7] = '..KKKfuKKuuKKuufKKK..';

  function makeSprite(rows) {
    const c = mk(rows[0].length, rows.length), g = c.getContext('2d');
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); }
      }
    });
    return c;
  }
  // trail : hauteur (depuis les pieds) où part l'arc-en-ciel.
  // Animation d'attente en boucle, indépendante du saut :
  // normal → tassé (on retire la ligne « cut », le haut descend d'1 px) → normal → petit détail (accent).
  const CHARS = [
    { name: 'GLACE', rows: BODY, blink: BLINK, trail: 24, cut: 17, accent: {
      1: '.......KWK.......',          // reflet sur la corne
      3: '.K....KYYYK....K.'           // les oreilles frétillent
    } },
    { name: 'CIGOGNE', rows: STORK, blink: STORK_BLINK, trail: 19, cut: 9, accent: {
      29: '........rr..rrrr....',      // elle lève une patte
      30: '.......rrrr.dddd....',
      31: '.......dddd.........'
    } },
    { name: 'FAUNE', rows: FAUN, blink: FAUN_BLINK, trail: 18, cut: 24, accent: {
      15: 'TT.KuKooovzvoooKuK...',     // la queue remue
      16: 'TtTKuKoooooooooKuK...',
      18: '.TTTKKoooqoooooKK....',
      19: '...TTKoooooooooK.....',
      20: '.....KoooooooooK.....'
    } }
  ].map(c => {
    const frames = rows => {
      const blank = '.'.repeat(rows[0].length);
      const squash = [blank].concat(rows.slice(0, c.cut), rows.slice(c.cut + 1));

  const IDLE_FPS = 5;

  let charIdx = clamp(parseInt(store.get('perso', '0'), 10) || 0, 0, CHARS.length - 1);
  const hero = () => CHARS[charIdx];
  const sprStar = makeSprite(STAR);

  function makeCloud(w, h, seed) {
    const n = 4 + (seed % 3), circles = [];
    for (let i = 0; i < n; i++) {
      const r = h * 0.3 + (hash(seed * 31 + i) % Math.max(1, (h * 0.25) | 0));
      circles.push([w * (i + 0.5) / n, h - r - 1, r]);
    }
    circles.push([w * 0.5, h * 0.5, h * 0.45]);
    const inside = (x, y) => circles.some(([cx, cy, r]) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r);
    const c = mk(w, h), g = c.getContext('2d');
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (!inside(x + 0.5, y + 0.5)) continue;
        const edge = !inside(x - 0.5, y + 0.5) || !inside(x + 1.5, y + 0.5) || !inside(x + 0.5, y - 0.5) || !inside(x + 0.5, y + 1.5);
        g.fillStyle = edge ? '#d9c6f0' : (y > h * 0.62 ? '#f3e6ff' : '#ffffff');

  const clouds = [makeCloud(40, 16, 3), makeCloud(56, 20, 7), makeCloud(30, 12, 11)];
  const puff = makeCloud(28, 12, 5);

  // ---------- Plateformes en sucreries ----------
  const DEPTH = 360;
  const STYLES = [
    { // cornet gaufré, glaçage fraise
      ice: ['#ffd6ea', '#ff9ecf', '#e67fb5'], deep: '#d79a52',
      body(x, y) { return ((x + y) % 8 === 0 || (x - y + 800) % 8 === 0) ? '#c27f36' : '#f0b765'; }
    },
    { // chocolat aux vermicelles, glaçage menthe
      ice: ['#d6fff0', '#8ee8c5', '#5fc9a3'], deep: '#5e382b',
      body(x, y) {
        const h = hash(x * 131 + y * 977) % 97;
        if (h === 0) return '#ff8fc1';
        if (h === 1) return '#ffe45c';
        if (h === 2) return '#59c3ff';
        if (h === 3) return '#ffffff';
        return y % 10 === 0 ? '#6a3d2f' : '#7b4b3a';
      }
    },
    { // gaufrette rose, glaçage citron
      ice: ['#fff6c9', '#ffe27a', '#e8c24f'], deep: '#d9789c',
      body(x, y) {

    }
  ];
  const rgbCache = {};
  const rgb = h => rgbCache[h] || (rgbCache[h] = hexRgb(h));

  function buildPlatform(pl) {
    const w = pl.w + 2, h = DEPTH, st = STYLES[pl.s];
    const c = mk(w, h), g = c.getContext('2d');
    const img = g.createImageData(w, h), d = img.data;
    const drip = [];
    for (let x = 0; x < w; x++) {
      const v = hash(pl.seed + (x >> 1)) % 9;
      drip[x] = v > 5 ? v - 3 : 0;
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let col;
        if (x === 0 || x === w - 1 || y === 0) col = OUT;
        else if (y === 1) col = st.ice[0];
        else if (y <= 5) col = st.ice[1];
        else if (y <= 5 + drip[x]) col = y === 5 + drip[x] ? st.ice[2] : st.ice[1];
        else if (y === 6 + drip[x]) col = st.ice[2];
        else col = st.body(x, y);
        const [r, gg, b] = rgb(col), i = (y * w + x) * 4;
        d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  // ---------- Écran ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const probe = document.getElementById('safe');
  const btnPause = document.getElementById('btnPause');
  const btnSound = document.getElementById('btnSound');
  const btnHome = document.getElementById('btnHome');
  let W = 320, H = 180, SCALE = 1, PX = 1;
  const safe = { l: 0, r: 0, t: 0, b: 0 };
  let skyC = mk(1, 1);
  const camBase = () => -H * 0.66;

  function buildSky() {
    const cols = ['#6f5bd6', '#8a6be0', '#a97ae6', '#cf8ee6', '#f0a3d9', '#ffbfd0', '#ffd9c4', '#ffeec2'];
    skyC = mk(W, H);
    const g = skyC.getContext('2d'), bh = H / cols.length;
    cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh) + 1); });

  }

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    SCALE = Math.min(vw / 240, vh / 180);
    W = Math.ceil(vw / SCALE);
    H = Math.ceil(vh / SCALE);
    const dpr = window.devicePixelRatio || 1;
    PX = Math.max(1, Math.round(SCALE * dpr));
    while (PX > 1 && W * H * PX * PX > 2.4e6) PX--;

    safe.r = parseFloat(cs.paddingRight) / SCALE || 0;
    safe.b = parseFloat(cs.paddingBottom) / SCALE || 0;
    safe.l = parseFloat(cs.paddingLeft) / SCALE || 0;
    buildSky();
    buildRainbow();
  }

  // ---------- Monde ----------
  const G = 900, JUMP_V = 265, DJUMP_V = 240, HW = 5;
  const RAINBOW = ['#ff4d6d', '#ff9f43', '#ffe14d', '#4ee08a', '#4db8ff', '#a46bff'];
  let platforms, gems, particles, popups, puffs, trail, player;
  let camX = 0, camY = 0, speed = 70, time = 0;
  let mode = 'title', paused = false, holding = false, jumpBuffer = 0;
  let distStart = 0, starsCount = 0, streak = 0, streakT = 0, sparkT = 0;
  let best = +store.get('best', '0') || 0, saveT = 0;

  function resetWorld() {
    platforms = [{ x: -300, w: 620, top: 0, s: 0, seed: 1 }];
    gems = []; particles = []; popups = []; puffs = []; trail = [];
    player = { x: 40, y: 0, vy: 0, grounded: true, canDouble: true, coyote: 0, hold: 0, lastTop: 0 };
    camX = player.x - W * 0.28;
    camY = camBase();
    while (lastPlat().x + lastPlat().w < camX + W + 200) genNext();
  }
  const lastPlat = () => platforms[platforms.length - 1];

  function genNext() {
    const last = lastPlat();
    const top = clamp(Math.round(last.top + rand(-26, 34)), -70, 70);
    const dy = top - last.top;
    const t = (JUMP_V + Math.sqrt(JUMP_V * JUMP_V + 2 * G * dy)) / G;
    const reach = (speed + 10) * t;
    const gap = Math.round(rand(Math.min(24, reach * 0.4), reach * 0.8));
    const pl = { x: last.x + last.w + gap, w: Math.round(rand(80, 220)), top, s: (Math.random() * 3) | 0, seed: (Math.random() * 1e9) | 0 };
    platforms.push(pl);
    if (Math.random() < 0.6) {
      const n = 3 + ((Math.random() * 3) | 0), x0 = last.x + last.w - 6, span = gap + 12;
      for (let k = 1; k <= n; k++) {
        const f = k / (n + 1);
        gems.push({ x: x0 + span * f, y: Math.min(last.top, top) - 22 - Math.sin(Math.PI * f) * 24, ph: Math.random() * 6 });
      }
    }
    if (Math.random() < 0.5) {
      const n = 3 + ((Math.random() * 3) | 0), x0 = pl.x + 20 + Math.random() * Math.max(0, pl.w - 40 - n * 14);
      for (let k = 0; k < n; k++) gems.push({ x: x0 + k * 14, y: pl.top - 16, ph: Math.random() * 6 });
    }
  }

  function burst(x, y, n, colors, spd, grav) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = rand(spd * 0.4, spd);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: grav, life: rand(0.35, 0.7), col: colors[i % colors.length] });
    }
  }
  function popup(x, y, txt) { popups.push({ x, y, txt, life: 1 }); }

  function doJump(v) {
    const p = player;
    p.vy = -v; p.grounded = false; p.coyote = 0;
    p.hold = holding ? 0.22 : 0;
  }

  function nextPlatformAhead() {
    for (const pl of platforms) if (pl.x + pl.w > player.x + HW) return pl;
    return lastPlat();
  }

  function rescue() {
    const p = player, pl = nextPlatformAhead();
    const h = Math.max(40, p.y - (pl.top - 26));
    p.vy = -Math.sqrt(2 * G * h);
    p.canDouble = true; p.hold = 0;
    puffs.push({ x: p.x, y: p.y, life: 1 });
    burst(p.x, p.y, 10, ['#ffffff', '#f3e6ff', '#d9c6f0'], 60, 0);
    popup(p.x, p.y - 34, 'POUF !');
    streak = 0;
    Sound.boing();
  }

  function step(dt) {
    time += dt;
    const p = player;
    if (mode === 'play') speed = Math.min(135, speed + dt * 0.45);

    // Pilote automatique sur l'écran titre.
    if (mode === 'title') {
      const nxt = nextPlatformAhead();
      const under = platforms.find(pl => p.x + HW > pl.x && p.x - HW < pl.x + pl.w && Math.abs(p.y - pl.top) < 1);
      if (p.grounded && under && under.x + under.w - p.x < 8) jumpBuffer = 0.1;
      if (!p.grounded && p.vy > 0 && p.canDouble && p.x + HW < nxt.x && p.y > nxt.top - 4) jumpBuffer = 0.1;
    }

    // Saut, saut tamponné et double saut.
    if (jumpBuffer > 0) {
      if (p.grounded || p.coyote > 0) {
        doJump(JUMP_V); p.canDouble = true; jumpBuffer = 0;
        burst(p.x, p.y, 4, ['#ffffff', '#ffe6f2'], 30, 60);
        Sound.jump();
      } else if (p.canDouble) {
        doJump(DJUMP_V); p.canDouble = false; jumpBuffer = 0;
        burst(p.x, p.y - 10, 12, RAINBOW, 70, 0);
        Sound.djump();
      } else {
        jumpBuffer -= dt;
      }
    }

    let g = G;
    if (holding && p.hold > 0 && p.vy < 0) { g *= 0.45; p.hold -= dt; }
    p.vy = Math.min(520, p.vy + g * dt);

    // Déplacement horizontal, avec petit coup de pouce sur les marches.
    let nx = p.x + speed * dt;
    for (const pl of platforms) {
      if (p.x + HW <= pl.x + 0.5 && nx + HW > pl.x && p.y > pl.top + 0.5) {
        if (p.y - pl.top <= 10) { p.y = pl.top; p.vy = 0; }
        else nx = pl.x - HW;
      }
    }
    // Déplacement vertical et atterrissage.
    let ny = p.y + p.vy * dt;
    const wasGrounded = p.grounded;
    p.grounded = false;
    if (p.vy >= 0) {
      for (const pl of platforms) {
        if (nx + HW > pl.x && nx - HW < pl.x + pl.w && p.y <= pl.top + 0.5 && ny >= pl.top) {
          ny = pl.top; p.vy = 0; p.grounded = true;
          if (!wasGrounded) {
            p.lastTop = pl.top; p.canDouble = true;
            burst(nx, ny, 6, STYLES[pl.s].ice, 40, 120);
            Sound.land();
          }
          break;
        }
      }
    }
    p.x = nx; p.y = ny;
    p.coyote = p.grounded ? 0.1 : p.coyote - dt;

    const nxt = nextPlatformAhead();
    if (!p.grounded && p.vy > 0 && p.y > Math.max(p.lastTop, nxt.top) + 70) rescue();

    // Étoiles à ramasser.
    streakT -= dt;
    if (streakT <= 0) streak = 0;
    for (const s of gems) {
      if (s.taken) continue;
      const dx = s.x - p.x, dy = s.y - (p.y - 16);
      if (dx * dx + dy * dy < 169) {
        s.taken = true;
        if (mode === 'play') starsCount++;
        Sound.star(streak);
        streak++; streakT = 1.2;
        burst(s.x, s.y, 8, ['#ffe45c', '#ffffff', '#ffb3d9'], 50, 0);
        if (streak > 0 && streak % 5 === 0) popup(s.x, s.y - 10, ['SUPER !', 'GENIAL !', 'BRAVO !', 'WAOUH !'][(streak / 5 - 1) % 4]);
      }
    }

    // Traînée arc-en-ciel.
    const ty0 = p.y - hero().trail;
    if (!trail.length || p.x - trail[trail.length - 1].x >= 1) trail.push({ x: p.x, y: ty0 });
    else trail[trail.length - 1].y = ty0;
    while (trail.length > 2 && trail[1].x < camX - 8) trail.shift();
    sparkT -= dt;
    if (sparkT <= 0) {
      sparkT = 0.07;
      particles.push({ x: p.x - 10, y: ty0 + rand(0, 12), vx: -6, vy: rand(-8, 8), g: 0, life: rand(0.5, 0.9), col: Math.random() < 0.5 ? '#ffffff' : '#fff3b0' });
    }

    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    for (const q of popups) { q.y -= 14 * dt; q.life -= dt * 0.8; }
    popups = popups.filter(q => q.life > 0);
    for (const q of puffs) q.life -= dt * 0.9;
    puffs = puffs.filter(q => q.life > 0);

    // Caméra.
    camX = p.x - W * 0.28;
    let ty = p.lastTop - H * 0.66;
    ty = Math.min(ty, p.y - 50);
    ty = Math.max(ty, p.y - H + 24);

    while (lastPlat().x + lastPlat().w < camX + W + 160) genNext();
    while (platforms.length > 1 && platforms[0].x + platforms[0].w < camX - 60) platforms.shift();
    gems = gems.filter(s => !s.taken && s.x > camX - 20);

    if (mode === 'play') {
      const dist = Math.floor((p.x - distStart) / 16);
      if (dist > best) best = dist;
      saveT -= dt;
      if (saveT <= 0) { saveT = 2; store.set('best', best); }
    }
  }

  // ---------- Dessin ----------
  function text(s, x, y, size, color, align) {
    ctx.font = size + 'px "Press Start 2P", ui-monospace, Menlo, monospace';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = OUT;
    ctx.fillText(s, x + 1, y); ctx.fillText(s, x - 1, y); ctx.fillText(s, x, y + 1); ctx.fillText(s, x, y - 1); ctx.fillText(s, x + 1, y + 1);

  function drawHills() {
    const vOff = camY - camBase();
    const layer = (par, base, col, top, fn) => {
      const off = Math.round(camX * par), ys = [];
      ctx.fillStyle = col;

        ys.push(y);
        ctx.fillRect(x, y + 2, 1, H - y);

      for (let x = 0; x < W; x++) ctx.fillRect(x, ys[x], 1, 2);

  function drawTrail() {

    for (let x = Math.round(p.x) - 6; x > camX - 4; x -= 2) {

  function drawPlayer() {
    const p = player;

  // Grand arc-en-ciel de fond, posé derrière les collines.
  let rainbowC = mk(1, 1), rainbowR = 0;
  function buildRainbow() {
    const R = Math.round(Math.min(W * 0.42, H * 0.5)), band = 4, outer = R + band * 6;
    const c = mk(outer * 2, outer), g = c.getContext('2d');
    const pastel = RAINBOW.map(hx => { const [r, gg, b] = hexRgb(hx); return `rgb(${(r + 255) >> 1},${(gg + 255) >> 1},${(b + 255) >> 1})`; });
    for (let y = 0; y < outer; y++) {
      for (let x = 0; x < outer * 2; x++) {
        const dist = Math.hypot(x + 0.5 - outer, outer - y - 0.5);
        const i = Math.floor((outer - dist) / band);
        if (i >= 0 && i < 6) { g.fillStyle = pastel[i]; g.fillRect(x, y, 1, 1); }

  }
  function drawRainbow() {
    const vOff = camY - camBase();
    ctx.globalAlpha = 0.7;
    ctx.drawImage(rainbowC, Math.round(W * 0.68 - rainbowR), Math.round(H * 0.7 - rainbowR - vOff * 0.08));
    ctx.globalAlpha = 1;
  }

  // Écran titre : choix du personnage.
  let cards = [];
  function drawTitle(cx) {
    const y0 = Math.round(Math.max(14, safe.t + 10, H * 0.06));
    rainbowText('GLACE', cx, y0, 16);
    rainbowText('LICORNE', cx, y0 + 21, 16);
    text('BARZOUTE GAMES', cx, y0 + 44, 8, '#ffffff', 'center');
    if (Math.floor(time * 2) % 2 === 0) text('CHOISIS TON PERSO', cx, y0 + 58, 8, '#fff3b0', 'center');
    const hint = Math.round(H - safe.b - 14);
    const top = y0 + 72, room = hint - 14 - top;
    const s = room >= 70 ? 2 : 1;
    const cw = Math.max(22 * s + 12, 62), ch = 32 * s + 8, gap = 6;
    const total = CHARS.length * cw + (CHARS.length - 1) * gap;
    let x = Math.round(cx - total / 2);
    cards = [];
    CHARS.forEach((c, i) => {
      const sel = i === charIdx;
      ctx.fillStyle = sel ? 'rgba(122, 92, 160, 0.92)' : 'rgba(59, 37, 80, 0.88)';
      ctx.fillRect(x, top, cw, ch + 12);
      ctx.fillStyle = sel ? '#fff3b0' : '#ffffff';
      ctx.fillRect(x, top, cw, 1); ctx.fillRect(x, top + ch + 11, cw, 1);
      ctx.fillRect(x, top, 1, ch + 12); ctx.fillRect(x + cw - 1, top, 1, ch + 12);
      const spr = sel ? idleSprite(c, (time % 3.2) < 0.12) : c.frames[0];
      ctx.drawImage(spr, Math.round(x + cw / 2 - spr.width * s / 2), top + ch - spr.height * s, spr.width * s, spr.height * s);
      text(c.name, Math.round(x + cw / 2), top + ch + 2, 8, sel ? '#fff3b0' : '#ffffff', 'center');
      cards.push({ x, y: top, w: cw, h: ch + 12 });
      x += cw + gap;
    });
    text('TAP = SAUT  2E TAP = DOUBLE', cx, hint, 8, '#ffffff', 'center');
    if (best > 0) text('RECORD ' + best + ' M', Math.round(6 + safe.l), Math.round(H - safe.b - 28), 8, '#d6fff0');
  }

  function draw() {
    ctx.setTransform(PX, 0, 0, PX, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(skyC, 0, 0);
    drawSkyStars();
    drawRainbow();
    drawHills();
    drawBgClouds();

    ctx.save();
    ctx.translate(-Math.round(camX), -Math.round(camY));
    for (const q of puffs) {
      ctx.globalAlpha = clamp(q.life, 0, 1);
      ctx.drawImage(puff, Math.round(q.x) - 14, Math.round(q.y) - 6);
    }
    ctx.globalAlpha = 1;
    drawPlatforms();
    for (const s of gems) ctx.drawImage(sprStar, Math.round(s.x) - 3, Math.round(s.y - 3 + Math.sin(time * 4 + s.ph) * 1.5));
    drawTrail();
    drawPlayer();
    for (const q of particles) { ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), 1, 1); }
    for (const q of popups) {
      ctx.globalAlpha = clamp(q.life * 2, 0, 1);
      text(q.txt, Math.round(q.x), Math.round(q.y), 8, '#fff7d6', 'center');
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    const cx = Math.round(W / 2);
    if (mode === 'play') {
      const x = Math.round(6 + safe.l), y = Math.round(6 + safe.t);
      ctx.drawImage(sprStar, x, y);
      text(String(starsCount), x + 11, y, 8, '#fff7d6');
      text(Math.floor((player.x - distStart) / 16) + ' M', x, y + 13, 8, '#fff7d6');
    } else {
      drawTitle(cx);
    }
    if (paused) {
      ctx.fillStyle = 'rgba(31, 21, 51, 0.55)';
      ctx.fillRect(0, 0, W, H);
      text('PAUSE', cx, Math.round(H / 2 - 14), 16, '#ffffff', 'center');
      text('TOUCHE POUR REPRENDRE', cx, Math.round(H / 2 + 8), 8, '#fff3b0', 'center');
    }
  }

  // ---------- Boucle ----------
  let lastT = performance.now(), acc = 0;
  const DT = 1 / 120;
  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.1) dt = 0.1;
    if (!paused) {
      acc += dt;
      while (acc >= DT) { step(DT); acc -= DT; }
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Commandes ----------
  const SOUND_ON = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="currentColor"/><rect x="3" y="3" width="1" height="6" fill="currentColor"/><rect x="4" y="2" width="1" height="8" fill="currentColor"/><rect x="5" y="1" width="1" height="10" fill="currentColor"/><rect x="7" y="5" width="1" height="2" fill="currentColor"/><rect x="8" y="3" width="1" height="1" fill="currentColor"/><rect x="9" y="4" width="1" height="4" fill="currentColor"/><rect x="8" y="8" width="1" height="1" fill="currentColor"/></svg>';
  const SOUND_OFF = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="currentColor"/><rect x="3" y="3" width="1" height="6" fill="currentColor"/><rect x="4" y="2" width="1" height="8" fill="currentColor"/><rect x="5" y="1" width="1" height="10" fill="currentColor"/><rect x="7" y="4" width="1" height="1" fill="currentColor"/><rect x="8" y="5" width="1" height="2" fill="currentColor"/><rect x="9" y="4" width="1" height="1" fill="currentColor"/><rect x="7" y="7" width="1" height="1" fill="currentColor"/><rect x="9" y="7" width="1" height="1" fill="currentColor"/></svg>';
  function renderSoundBtn() {
    btnSound.innerHTML = Sound.muted ? SOUND_OFF : SOUND_ON;
    btnSound.setAttribute('aria-label', Sound.muted ? 'Remettre le son' : 'Couper le son');
  }
  function setPaused(v) {
    if (mode !== 'play') return;
    paused = v;
    btnPause.setAttribute('aria-label', v ? 'Reprendre' : 'Pause');
    if (v) { Sound.stop(); holding = false; }
    else { Sound.resume(); Sound.start(); lastT = performance.now(); }
  }
  function pick(i) {
    charIdx = (i + CHARS.length) % CHARS.length;
    store.set('perso', charIdx);
  }
  function startGame() {
    mode = 'play';
    distStart = player.x; starsCount = 0; speed = 80; streak = 0;
    btnPause.hidden = false; btnHome.hidden = false;
    Sound.start();
  }
  function goTitle() {
    if (mode !== 'play') return;
    if (paused) setPaused(false);
    mode = 'title'; speed = 70; holding = false;
    btnPause.hidden = true; btnHome.hidden = true;
  }
  function press(e) {
    Sound.init();
    if (mode === 'title') {
      if (e) {
        const lx = e.clientX / SCALE, ly = e.clientY / SCALE;
        const i = cards.findIndex(c => lx >= c.x && lx < c.x + c.w && ly >= c.y && ly < c.y + c.h);
        if (i >= 0) pick(i);
      }
      startGame();
      return;
    }
    if (paused) { setPaused(false); return; }
    holding = true;
    jumpBuffer = 0.12;
  }
  function release() { holding = false; }

  window.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    press(e);
  }, { passive: false });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  document.addEventListener('touchstart', e => {
    if (!(e.target.closest && e.target.closest('button'))) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  // Sur iOS, l'audio ne démarre qu'après un geste « complet » : on relance au relâchement.
  document.addEventListener('touchend', () => Sound.init());
  document.addEventListener('click', () => Sound.init());

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      if (e.target.closest && e.target.closest('button')) return;
      e.preventDefault();
      if (!e.repeat) press();
    } else if (mode === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      pick(charIdx + (e.code === 'ArrowLeft' ? -1 : 1));
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      setPaused(!paused);
    } else if (e.code === 'KeyM') {
      Sound.init(); Sound.setMuted(!Sound.muted); renderSoundBtn();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') release();
  });

  btnSound.addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); renderSoundBtn(); });
  btnPause.addEventListener('click', () => { Sound.init(); setPaused(!paused); });
  btnHome.addEventListener('click', () => { Sound.init(); goTitle(); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { setPaused(true); Sound.suspend(); store.set('best', best); }
  });
  window.addEventListener('resize', resize);

  resize();
  resetWorld();
  renderSoundBtn();
  requestAnimationFrame(frame);
})();
</script>
<!-- ARTIFACT-END -->
</body>
</html>
